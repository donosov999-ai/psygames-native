<!doctype html>
<meta charset="utf-8">
<title>PsyGames — редактор плейлистов</title>
<!--
  РЕДАКТОР ПЛЕЙЛИСТОВ · VER 1 · 13.09.2026

  Просьба Дениса: «мне не нравится что сейчас это занимает много времени, а по сути
  это редакция списка». Раньше галочка «какая игра в каком профиле» ехала к человеку
  через коммит, CI, сборку и магазины — часами. Здесь она ставится мышью, а результат
  уезжает файлом настроек, который приложение читает само.

  🔴 СТРАНИЦА СОБИРАЕТСЯ СКРИПТОМ, ПРАВИТЬ НАДО ШАБЛОН.
  `node scripts/build-playlist-editor.mjs` вклеивает сюда свежий снимок состава.
  Открывать готовый `tools/playlist-editor.html` прямо с диска — ни сервера, ни сети.

  Зависимостей нет нарочно: инструмент одного человека не должен ломаться из-за
  того, что чей-то CDN сегодня недоступен.
-->
<style>
  :root {
    --фон: #f6f7f9; --карта: #fff; --текст: #16191d; --тускло: #6b7280;
    --рамка: #e5e7eb; --синий: #2563eb; --зелёный: #16a34a; --красный: #dc2626;
    --жёлтый: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --фон: #14171a; --карта: #1c2024; --текст: #e8eaed; --тускло: #9aa0a6;
            --рамка: #2c3237; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, system-ui, sans-serif;
         background: var(--фон); color: var(--текст); }
  header { position: sticky; top: 0; z-index: 10; background: var(--карта);
           border-bottom: 1px solid var(--рамка); padding: 10px 16px;
           display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  .растяжка { flex: 1; }
  button { font: inherit; padding: 7px 13px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--рамка); background: var(--карта); color: var(--текст); }
  button.главная { background: var(--синий); color: #fff; border-color: var(--синий); }
  button:hover { filter: brightness(0.97); }
  main { display: grid; grid-template-columns: 200px 1fr 260px; gap: 14px; padding: 16px;
         align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 200px 1fr; } .превью { display: none; } }
  .превью img { width: 100%; border-radius: 12px; display: block; background: var(--фон); }
  .превью h3 { margin: 10px 0 4px; font-size: 15px; }
  .превью .подсказка { color: var(--тускло); font-size: 12px; }
  .колонка, .панель { background: var(--карта); border: 1px solid var(--рамка);
                      border-radius: 12px; padding: 12px; }
  .профиль { display: flex; justify-content: space-between; gap: 8px; padding: 7px 9px;
             border-radius: 8px; cursor: pointer; }
  .профиль:hover { background: var(--фон); }
  .профиль.выбран { background: var(--синий); color: #fff; }
  .профиль .счёт { color: var(--тускло); font-variant-numeric: tabular-nums;
                   display: inline-flex; align-items: center; gap: 2px; }
  .двиг { padding: 0 5px; border: none; background: transparent; color: inherit;
          opacity: .35; font-size: 12px; line-height: 1; }
  .профиль:hover .двиг { opacity: .9; }
  .профиль.выбран .счёт { color: #dbeafe; }
  .витрина { font-size: 11px; color: var(--жёлтый); }
  .вкладки { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .вкладка { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--рамка);
             cursor: pointer; }
  .вкладка.выбрана { background: var(--текст); color: var(--фон); }
  .разделы { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  .бейдж { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--рамка);
           font-size: 12px; }
  .бейдж.ноль { border-color: var(--красный); color: var(--красный); font-weight: 700; }
  .строка { display: flex; align-items: center; gap: 10px; padding: 5px 6px;
            border-radius: 7px; }
  .строка:hover { background: var(--фон); }
  .строка .ид { color: var(--тускло); font-size: 12px; }
  .заголовокРаздела { margin: 14px 0 4px; font-weight: 700; color: var(--тускло);
                      text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
  /* 🔴 ИМЯ СЕРИИ — КРУПНО И ТЁМНЫМ (просьба Дениса 13.09.2026: «названия серий
     жирным и крупнее по шрифту»). Общая шапка раздела — мелкая капитель, и в
     списке из двадцати шести серий имя в ней теряется среди служебных цифр. */
  .имяСерии { margin: 18px 0 4px; font-weight: 800; color: var(--текст);
              font-size: 17px; letter-spacing: 0; text-transform: none; }
  .имяСерии .числа { font-weight: 500; font-size: 12.5px; color: var(--тускло); margin-left: 8px; }
  input[type=search], input[type=text], input[type=number], select {
    font: inherit; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--рамка);
    background: var(--фон); color: var(--текст); }
  input[type=number] { width: 72px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 5px 7px; border-bottom: 1px solid var(--рамка); text-align: left; }
  .шаг { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         padding: 6px; border: 1px solid var(--рамка); border-radius: 8px; margin-bottom: 6px; }
  .мелко { font-size: 12px; color: var(--тускло); }
  .пусто { color: var(--тускло); padding: 10px 0; }
  #итог { font-size: 12px; color: var(--тускло); }
</style>

<header>
  <h1>Редактор плейлистов</h1>
  <span id="итог"></span>
  <span id="куда" class="мелко"></span>
  <span class="растяжка"></span>
  <button id="кнЗагрузить">Открыть файл…</button>
  <button id="кнБуфер">Скопировать в буфер</button>
  <button id="кнСкачать">Скачать в Загрузки</button>
  <button id="кнСохранить" class="главная">Сохранить</button>
</header>

<main>
  <div class="колонка">
    <div class="мелко" style="margin-bottom:8px">Профили</div>
    <div id="списокПрофилей"></div>
  </div>

  <div class="панель">
    <div class="вкладки" id="вкладки"></div>
    <div id="тело"></div>
  </div>

  <div class="колонка превью" id="превью">
    <div class="подсказка">Нажми на строку игры — покажу, что это.</div>
  </div>
</main>

<script>
/* Снимок состава вклеивается сборщиком. */
const ДАННЫЕ = /*ДАННЫЕ*/null/*/ДАННЫЕ*/;

/* ── состояние правок. Пусто = «ничего не меняли», и в файл такое не попадает ── */
const правки = { профили: {}, наборы: [], замки: {}, коллекция: {}, серии: {}, блоки: {}, порядок: null };
let текущийПрофиль = ДАННЫЕ.профили[0].id;
let вкладка = 'игры';

const поId = Object.fromEntries(ДАННЫЕ.профили.map(p => [p.id, p]));
const игрыПоРазделам = {};
for (const г of ДАННЫЕ.игры) (игрыПоРазделам[г.раздел] ??= []).push(г);

/**
 * 🔴 ГОЛОВОЛОМКИ ТЭТХЭМА ВИДНЫ ПООТДЕЛЬНОСТИ.
 * Денис 13.09.2026: «в зарядке или в серии ты просто включал Пазлы, а что из
 * пазла идёт в серию — непонятно». Движков сорок два, у каждого свои правила и
 * своя лестница, но в каталоге это ОДНА карточка `puzzles` с параметром режима.
 * Здесь к списку добавляются виртуальные строки `puzzles:<Режим>`; в файл они
 * уходят обычной парой `game_id` + `mode`, ничего нового приложению не нужно.
 */
const ТЭТХЭМА = ДАННЫЕ.тэтхэма || [];
const ВСЕ_ИГРЫ = [...ДАННЫЕ.игры, ...ТЭТХЭМА];
/** id для выпадающего списка: у головоломки — «puzzles:Net», у остальных — как есть. */
const идШага = (ш) => (ш.game_id === 'puzzles' && ш.mode ? `puzzles:${ш.mode}` : ш.game_id);
const подпись = (г) => (г.режим ? `${г.имя} — Тэтхэма` : г.id);
const РАЗВИЛКА_ГОЛОВОЛОМОК = '/games/puzzles-hub';
/**
 * 🔴 ГОЛОВОЛОМКИ НЕ ИДУТ В СЧЁТ ИГР ПРОФИЛЯ.
 *
 * Денис 13.09.2026: «27 — это с учётом Тэтхэма или без? надо чтобы без, они ещё не
 * все красивые и отработанные». Замер: в 27 они входили ОДНОЙ карточкой каталога
 * (`puzzles`), а не сорока двумя — но и одна лишняя врёт, когда по ней принимают
 * решение «этому профилю хватает игр». У них свой счётчик в своём разделе.
 */
const ВНЕ_СЧЁТА = new Set(['puzzles']);
/** Элемент списка развилки — маршрут строкой или карточка, описанная файлом. */
const маршрутЭлемента = (э) => (typeof э === 'string' ? э : э.маршрут);
const естьВХабе = (список, маршрут) => список.some(э => маршрутЭлемента(э) === маршрут);
/** Какие головоломки показывает развилка этому профилю (файл или заводской состав). */
/** Маршрут головоломки → развилка, в которой она сейчас лежит у этого профиля. */
function развилкиГоловоломок() {
  const итог = {};
  for (const хаб of Object.keys(ДАННЫЕ.хабы)) {
    const список = правки.профили[текущийПрофиль]?.хабы?.[хаб]
      ?? (ДАННЫЕ.хабы[хаб] || []).map(к => к.route);
    for (const э of список) {
      const м = маршрутЭлемента(э);
      if (м.startsWith('/games/puzzles') && !итог[м]) итог[м] = хаб;
    }
  }
  return итог;
}

function развилкаГоловоломок() {
  const мои = правки.профили[текущийПрофиль]?.хабы?.[РАЗВИЛКА_ГОЛОВОЛОМОК];
  return (мои ?? (ДАННЫЕ.хабы[РАЗВИЛКА_ГОЛОВОЛОМОК] || []).map(к => к.route)).map(маршрутЭлемента);
}

/** Что сейчас включено у профиля: правка, если её делали, иначе заводское. */
function составПрофиля(ид) {
  const мой = правки.профили[ид];
  if (мой && мой.игры !== undefined) return мой.игры;
  return поId[ид].игры;
}
/** Открыта ли игра профилю. `всегда` из снимка — это `ALWAYS_ALLOWED` приложения. */
const включена = (ид, игра) => {
  /* Закрытое файлом сильнее общего доступа — так же, как в приложении. */
  if ((правки.профили[ид]?.убрать ?? []).includes(игра)) return false;
  const г = ДАННЫЕ.игры.find(x => x.id === игра);
  if (г && г.всегда) return true;
  const с = составПрофиля(ид);
  return с === 'all' || (Array.isArray(с) && с.includes(игра));
};

/**
 * 🔴 ГАЛОЧКА НЕ ПЕРЕРИСОВЫВАЕТ СПИСОК ЦЕЛИКОМ.
 *
 * Первая редакция звала `нарисовать()` на каждый клик, и при 95 строках это значило
 * прыжок прокрутки после каждой галочки: разметка пересобиралась, браузер терял
 * место. Поймано живой проверкой — автоматический клик подменял элемент под курсором
 * и снял подряд 27 галочек вместо одной.
 *
 * Поэтому здесь меняются только те три вещи, которые правда зависят от галочки:
 * счётчики разделов, число у профиля и строка «изменено». Сам список не трогается —
 * его состояние и так в самом чекбоксе.
 */
function переключить(ид, игра) {
  const мои = (правки.профили[ид] ??= {});
  const г = ДАННЫЕ.игры.find(x => x.id === игра);
  /**
   * 🔴 ИГРУ, ОТКРЫТУЮ ВСЕМ, СНИМАЕТ ДРУГОЕ ПОЛЕ. Список `игры` её не перебивает:
   * в приложении общий доступ отвечает «да» раньше, чем смотрит на профиль.
   * Поэтому у таких игр галочка правит `убрать` — поле, заведённое ровно под это
   * (просьба Дениса 13.09.2026 про головоломки Тэтхэма «выключить по умолчанию»).
   */
  if (г && г.всегда) {
    const закрыто = new Set(мои.убрать ?? []);
    if (закрыто.has(игра)) закрыто.delete(игра); else закрыто.add(игра);
    if (закрыто.size) мои.убрать = [...закрыто]; else delete мои.убрать;
    обновитьСчётчики();
    return;
  }
  const было = составПрофиля(ид);
  /* «Все игры» разворачивается в явный список при первой же правке: иначе снятие
     одной галочки пришлось бы хранить как «все, кроме», а это другая сущность. */
  const список = было === 'all' ? ДАННЫЕ.игры.map(г2 => г2.id) : [...было];
  const i = список.indexOf(игра);
  if (i >= 0) список.splice(i, 1); else список.push(игра);
  мои.игры = список;
  обновитьСчётчики();
}

function обновитьСчётчики() {
  const счёт = поРазделам(текущийПрофиль);
  document.querySelectorAll('[data-счётраздела]').forEach(э => {
    const р = э.dataset.счётраздела ?? э.dataset.счётраздела;
    э.textContent = `${р} — ${счёт[р]} из ${игрыПоРазделам[р].length}`;
  });
  document.querySelectorAll('input[data-раздел]').forEach(э => {
    const р = э.dataset.раздел;
    const n = счёт[р], всего = игрыПоРазделам[р].length;
    э.checked = n === всего;
    э.indeterminate = n > 0 && n < всего;   // часть выбрана — видно сразу
  });
  document.querySelectorAll('[data-бейдж]').forEach(б => {
    const н = счёт[б.dataset.бейдж] ?? 0;
    б.textContent = `${б.dataset.бейдж}: ${н}`;
    б.classList.toggle('ноль', н === 0);
  });
  document.querySelectorAll('[data-шапкараздела]').forEach(з => {
    const р = з.dataset.шапкараздела;
    з.textContent = `${р} — ${счёт[р]} из ${игрыПоРазделам[р].length}`;
  });
  нарисоватьПрофили();
  нарисоватьИтог();
}

function нарисоватьИтог() {
  сохранитьЧерновик();
  const менялось = Object.keys(правки.профили).length;
  document.getElementById('итог').textContent = менялось
    ? `изменено профилей: ${менялось}${правки.наборы.length ? `, своих наборов: ${правки.наборы.length}` : ''}`
    : 'правок нет — файл будет пустым';
}

/* ── подсчёт по разделам: ноль в разделе = пустая полка у игрока ── */
/* Счёт по разделам считает и открытые всем: иначе «recovery — 0 из 2» при двух
   включённых играх — то же враньё, только цифрой. */
function поРазделам(ид) {
  const итог = {};
  for (const [раздел, игры] of Object.entries(игрыПоРазделам))
    итог[раздел] = игры.filter(г => !ВНЕ_СЧЁТА.has(г.id) && включена(ид, г.id)).length;
  return итог;
}

/**
 * 🔴 СЧЁТЧИК ПОКАЗЫВАЕТ ТО, ЧТО ВИДИТ ЧЕЛОВЕК, А НЕ ДЛИНУ СПИСКА.
 *
 * Замер 13.09.2026: в колонке слева у «Стандарта» стояло 12, у «Реакции ПРО» 12,
 * у «50+» 14 — и это выглядело как «профиль почти пустой». На самом деле к списку
 * профиля добавляются игры из общего доступа (`ALWAYS_ALLOWED`: дыхание, «Пауза»,
 * парные картинки, судоку, головоломки Тэтхэма, ментальная ротация, забег), и в
 * меню у самого бедного профиля 23 игры, а не 12.
 *
 * Длина списка — внутренняя величина; показывать её человеку значит звать чинить
 * то, что не сломано. Поэтому считается сумма: свои плюс открытые всем.
 */
function числоИгр(ид) {
  const с = составПрофиля(ид);
  if (с === 'all') return ДАННЫЕ.игры.filter(г => !ВНЕ_СЧЁТА.has(г.id)).length;
  const общие = ДАННЫЕ.игры.filter(г => г.всегда && !ВНЕ_СЧЁТА.has(г.id) && !с.includes(г.id)).length;
  return с.filter(id => !ВНЕ_СЧЁТА.has(id)).length + общие;
}

/* ── отрисовка ─────────────────────────────────────────────────────────────── */
/**
 * Порядок профилей — тот же в редакторе и в приложении (просьба Дениса 13.09.2026).
 * Неназванные профили идут следом в заводском порядке, поэтому потерять профиль
 * перестановкой нельзя.
 */
function профилиПоПорядку() {
  const п = правки.порядок;
  if (!п || !п.length) return ДАННЫЕ.профили;
  const поId2 = new Map(ДАННЫЕ.профили.map(x => [x.id, x]));
  const итог = [];
  for (const ид of п) { const x = поId2.get(ид); if (x) { итог.push(x); поId2.delete(ид); } }
  for (const x of ДАННЫЕ.профили) if (поId2.has(x.id)) итог.push(x);
  return итог;
}

function двинуть(ид, куда) {
  const текущ = профилиПоПорядку().map(x => x.id);
  const i = текущ.indexOf(ид), j = i + куда;
  if (i < 0 || j < 0 || j >= текущ.length) return;
  текущ.splice(j, 0, текущ.splice(i, 1)[0]);
  правки.порядок = текущ;
  нарисовать();
}

function нарисоватьПрофили() {
  const узел = document.getElementById('списокПрофилей');
  узел.innerHTML = '';
  for (const п of профилиПоПорядку()) {
    const д = document.createElement('div');
    д.className = 'профиль' + (п.id === текущийПрофиль ? ' выбран' : '');
    const менялся = правки.профили[п.id] ? ' •' : '';
    д.innerHTML = `<span>${п.имя}${менялся}${п.витрина ? '<div class="витрина">витрина, не профиль</div>' : ''}</span>`
                + `<span class="счёт">`
                + `<button class="двиг" data-вверх="${п.id}" title="выше">↑</button>`
                + `<button class="двиг" data-вниз="${п.id}" title="ниже">↓</button>`
                + ` ${числоИгр(п.id)}</span>`;
    д.onclick = (e) => {
      if (e.target.classList.contains('двиг')) return;   // стрелки не переключают профиль
      текущийПрофиль = п.id; нарисовать();
    };
    д.querySelector('[data-вверх]').onclick = () => двинуть(п.id, -1);
    д.querySelector('[data-вниз]').onclick = () => двинуть(п.id, 1);
    узел.appendChild(д);
  }
}

function нарисоватьВкладки() {
  const узел = document.getElementById('вкладки');
  узел.innerHTML = '';
  for (const [ключ, имя] of [['игры','Игры в профиле'],['главная','Главная'],['зарядка','Зарядка'],['хабы','Состав развилок'],['серии','Серии'],['уровни','Уровни'],['баланс','Баланс']]) {
    const д = document.createElement('div');
    д.className = 'вкладка' + (вкладка === ключ ? ' выбрана' : '');
    д.textContent = имя;
    д.onclick = () => { вкладка = ключ; нарисовать(); };
    узел.appendChild(д);
  }
}

function телоИгры() {
  const ид = текущийПрофиль;
  const счёт = поРазделам(ид);
  const бейджи = Object.entries(счёт).map(([р, н]) =>
    `<span class="бейдж${н === 0 ? ' ноль' : ''}" data-бейдж="${р}">${р}: ${н}</span>`).join('');
  const поиск = `<input type="search" id="поиск" placeholder="найти игру…" style="width:220px">`;
  let html = `<div class="разделы">${бейджи}</div>${поиск}`;
  /**
   * 🔴 ИГРА, ОТКРЫТАЯ ВСЕМ, РИСУЕТСЯ ВКЛЮЧЁННОЙ И НЕ СНИМАЕТСЯ.
   * Денис 13.09.2026: «recovery — 0 из 2, pause и breathing — просил во всех
   * включить по умолчанию». Они и включены — в приложении `isGameAllowed`
   * отвечает «да» до всякой проверки профиля. Врал редактор: галочку он рисовал
   * по списку профиля, про общий список не знал, и снять её всё равно было
   * нельзя. Переключатель, который показывает ложь и ничего не переключает,
   * хуже отсутствующего.
   */
  const строка = (г) => `<label class="строка">
      <input type="checkbox" ${включена(ид, г.id) ? 'checked' : ''} data-игра="${г.id}">
      <span>${г.id}</span><span class="ид">${г.route}</span>
      ${г.всегда ? '<span class="ид">открыта всем — снять можно</span>' : ''}</label>`;
  /* 🔴 ГАЛОЧКА ЖИВАЯ, НО ПИШЕТ НЕ ТУДА, КУДА ОСТАЛЬНЫЕ. Профиль знает один id
     `puzzles`, поэтому отдельная головоломка включается не списком игр, а составом
     развилки (`хабы['/games/puzzles-hub']`) — то же поле, что во вкладке «Состав
     развилок». Запертая галочка тут врала бы так же, как врала «recovery — 0 из 2». */
  /* Где головоломка лежит СЕЙЧАС — по ВСЕМ развилкам: после раскладки по темам
     галочка одной развилки давала ложное «выключено». */
  const гдеГоловоломки = развилкиГоловоломок();
  html += `<div class="заголовокРаздела">Головоломки Тэтхэма — ${Object.keys(гдеГоловоломки).length} из ${ТЭТХЭМА.length}
    <span class="ид">в счёт игр профиля не входят</span>
    <span class="ид">галочка правит состав развилки этого профиля</span></div>`;
  /* Пометка «— Тэтхэма» стоит В КАЖДОЙ СТРОКЕ, а не только в шапке раздела
     (просьба Дениса 13.09.2026: «подписать типа Сапёр — Тэтхэма»): строк сорок
     две, шапка уезжает за край экрана, и без пометки «Сапёр» читается как игра
     каталога. */
  html += ТЭТХЭМА.map(г => {
    const хаб = гдеГоловоломки[г.route];
    return `<label class="строка">
      <input type="checkbox" ${хаб ? 'checked' : ''} ${хаб ? '' : 'disabled'}
             data-головоломка="${г.route}" data-вхабе="${хаб || ''}">
      <span>${г.имя} — Тэтхэма</span><span class="ид">${г.режим}</span>
      <span class="ид">${хаб ? 'в развилке ' + хаб.replace('/games/', '') : 'нигде'}</span></label>`;
  }).join('');

  for (const [раздел, игры] of Object.entries(игрыПоРазделам)) {
    /* 🔴 ГАЛОЧКА НА ВЕСЬ РАЗДЕЛ — просьба Дениса: «чтобы я весь хаб сразу мог одним
       кликом выбрать». Три состояния: все · часть (промежуточное) · ни одной. */
    const своих = счёт[раздел], всего = игры.length;
    html += `<div class="заголовокРаздела" data-шапкараздела="${раздел}">
        <label style="display:inline-flex;gap:8px;align-items:center;cursor:pointer;text-transform:none;font-size:12px">
          <input type="checkbox" data-раздел="${раздел}"
                 ${своих === всего ? 'checked' : ''}>
          <span data-счётраздела="${раздел}">${раздел} — ${своих} из ${всего}</span>
        </label></div>`;
    html += игры.map(строка).join('');
  }
  return html;
}

/**
 * 🔴 ФАКТИЧЕСКИЙ НАБОР ПОКАЗЫВАЕТСЯ СРАЗУ РАСКРЫТЫМ.
 * Просьба Дениса: «чтобы раскрытыми были, не кликать чтобы взять набор — мне надо
 * видеть сразу». Поэтому когда своего набора нет, отдаём тот, что слот даёт
 * сегодня: строки те же, править можно сразу, и первая же правка делает набор
 * своим — отдельная кнопка «взять» для этого больше не нужна.
 */
function шагиПрофиля(когда) {
  const мой = правки.профили[текущийПрофиль]?.[когда];
  if (мой !== undefined) return мой;
  const заводской = поId[текущийПрофиль][когда];
  if (заводской && заводской.length) return заводской;
  const ф = поId[текущийПрофиль].сейчас || {};
  const факт = (когда === 'утро' ? ф['утро' + утроМинут] : ф[когда]) || [];
  return факт.map(ш => {
    const г = ДАННЫЕ.игры.find(x => x.id === ш.game_id);
    return { game_id: ш.game_id, game_route: г ? г.route : '/games/' + ш.game_id,
             est_duration_sec: ш.est_duration_sec || 60 };
  });
}

/** Свой ли это набор или показанный «как есть» — от этого зависит подпись. */
function наборСвой(когда) {
  return правки.профили[текущийПрофиль]?.[когда] !== undefined
      || Boolean((поId[текущийПрофиль][когда] || []).length);
}

function нарисоватьШаг(шаг, когда, i) {
  const текущий = идШага(шаг);
  const выбор = ВСЕ_ИГРЫ.map(г =>
    `<option value="${г.id}" ${г.id === текущий ? 'selected' : ''}>${подпись(г)}</option>`).join('');
  return `<div class="шаг" data-когда="${когда}" data-и="${i}">
    <select data-поле="game_id">${выбор}</select>
    <label class="мелко">повторов <input type="number" min="1" max="99"
      value="${шаг.trials ?? шаг.settings?.trials ?? ''}" data-поле="trials"></label>
    <label class="мелко">секунд <input type="number" min="10" max="900"
      value="${шаг.est_duration_sec ?? 60}" data-поле="est_duration_sec"></label>
    <select data-поле="difficulty">
      ${['','easy','medium','hard'].map(d =>
        `<option value="${d}" ${d === (шаг.difficulty ?? '') ? 'selected' : ''}>${d || 'по умолчанию'}</option>`).join('')}
    </select>
    <button data-убрать="1">убрать</button>
  </div>`;
}

/**
 * 🔴 СЛОТОВ ЧЕТЫРЕ, А НЕ ДВА, И ЕЩЁ СЕМЬ ДНЕЙ НЕДЕЛИ.
 * Заметил Денис: «а где день и вечер? утро и ночь — там же 4 шт» и «по дням недели
 * тоже не вижу выкладку». Было показано только утро с вечером, а недельный план
 * лишь назывался. Теперь правятся все.
 */
const ДНИ = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
/* Длительность утренней зарядки выбирается на экране зарядки; по умолчанию 5. */
let утроМинут = 5;
const СЛОТЫ = [['утро', 'Утро'], ['день', 'День — перерыв'], ['вечер', 'Вечер'], ['ночь', 'Ночь — «не спится»']];

function шагиПоДню(д) {
  const мои = правки.профили[текущийПрофиль]?.по_дням;
  if (мои && мои[д] !== undefined) return мои[д];
  const зав = поId[текущийПрофиль].по_дням;
  return (зав && зав[д]) ? зав[д] : [];
}

/**
 * 🔴 СЕТКА: ДЕНЬ × СЛОТ × ДЛИНА. Двенадцать списков на день, восемьдесят четыре
 * на профиль.
 *
 * Две правки Дениса 13.09.2026:
 *   «должно быть три раскладки: 5 минут, 10 минут и 15 минут» — а не одна урезанная;
 *   «выбор длины нужен во всех 4 зарядках, а не только в утре».
 *
 * ⚠️ ВСЁ РАСКРЫТО СРАЗУ, без вкладок и «взять набор» — его же просьба: «мне надо
 * видеть сразу». Пустая клетка показывает то, что приложение выдаёт в ней
 * сегодня; первая правка превращает показанное в свой список.
 */
let деньРедактора = ДАННЫЕ.деньНедели;
/**
 * 🔴 ДЛИНА — ТОЖЕ ВКЛАДКА, А НЕ ТРЕТЬЯ ПРОСТЫНЯ ВНИЗ.
 * Денис 13.09.2026: «надо табами минуты сделать, как по дням недели, а то
 * простыня вниз и путаница». Двенадцать списков на одном экране не читаются:
 * день и длина выбираются сверху, ниже остаются четыре слота — ровно то, что
 * человек сравнивает глазами за один раз.
 */
let длинаРедактора = 5;
const ДЛИНЫ = [5, 10, 15];

function шагиСетки(д, слот, длина) {
  const мои = правки.профили[текущийПрофиль]?.сетка?.[д]?.[слот]?.[длина];
  if (мои !== undefined) return мои;
  const ф = поId[текущийПрофиль].сейчас || {};
  const факт = (ф.сетка && ф.сетка[д] && ф.сетка[д][слот] && ф.сетка[д][слот][длина]) || [];
  return факт.map(ш => {
    const г = ДАННЫЕ.игры.find(x => x.id === ш.game_id);
    return { game_id: ш.game_id, game_route: г ? г.route : '/games/' + ш.game_id,
             est_duration_sec: ш.est_duration_sec || 60 };
  });
}

/** Свой ли список в этой клетке — от этого зависит подпись «свой» / «как сейчас». */
function клеткаСвоя(д, слот, длина) {
  return правки.профили[текущийПрофиль]?.сетка?.[д]?.[слот]?.[длина] !== undefined;
}

function положитьВСетку(д, слот, длина, шаги) {
  const мои = (правки.профили[текущийПрофиль] ??= {});
  const сетка = (мои.сетка ??= {});
  const день = (сетка[д] ??= {});
  const сл = (день[слот] ??= {});
  сл[длина] = шаги;
}

function телоЗарядка() {
  let html = `<div class="мелко">Зарядка правится по клеткам: <b>день недели × время суток × длина</b>.
    Каждая длина — свой список целиком, а не обрезок длинного: «пять минут» может начинаться с другого
    упражнения. Клетка, которую не трогали, показывает то, что приложение выдаёт в ней сейчас.</div>`;
  html += `<div class="мелко" style="margin:8px 0">день недели: ` + ДНИ.map((имя, д) =>
    `<button data-деньсетки="${д}" style="${д === деньРедактора ? 'font-weight:700;text-decoration:underline' : ''}">${имя}</button>`
  ).join(' ') + `</div>`;
  html += `<div class="мелко" style="margin:8px 0">длина зарядки: ` + ДЛИНЫ.map(l =>
    `<button data-длинасетки="${l}" style="${l === длинаРедактора ? 'font-weight:700;text-decoration:underline' : ''}">${l} мин</button>`
  ).join(' ') + `</div>`;

  for (const [когда, имя] of СЛОТЫ) {
    {
      const длина = длинаРедактора;
      const шаги = шагиСетки(деньРедактора, когда, длина);
      const минут = Math.round(шаги.reduce((с, ш) => с + (ш.est_duration_sec || 0), 0) / 60);
      const метка = клеткаСвоя(деньРедактора, когда, длина) ? 'свой список' : 'как сейчас в приложении';
      const адрес = `сетка:${деньРедактора}|${когда}|${длина}`;
      html += `<div class="заголовокРаздела">${имя} · ${длина} мин — упражнений ${шаги.length} · по оценкам ${минут} мин
        <span class="ид">${метка}</span></div>`;
      html += шаги.length
        ? шаги.map((ш, i) => нарисоватьШаг(ш, адрес, i)).join('')
        : '<div class="пусто">пусто</div>';
      html += `<button data-всетку="${адрес}">+ упражнение</button>
        <button data-очиститьклетку="${адрес}">вернуть заводское</button>`;
    }
  }
  return html;
}

/**
 * 🔴 СВОЙ НАБОР — ЭТО «ПОТОК», А НЕ ЕЩЁ ОДНА ДЛИНА ЗАРЯДКИ.
 *
 * Правка Дениса 13.09.2026: «и 5, и 10, и 15 — это не свои наборы, это режимы
 * зарядок». Три «разминки на N минут», которые тут стояли, убраны: длина зарядки
 * выбирается кнопкой перед стартом, и в списке назначаемых наборов ей не место.
 *
 * Что здесь вместо них — его же формулировка: «наборы на 5–15 минут для каждого
 * профиля отдельно, в режиме поток, с бомбардировкой узких навыков». Для шахмат
 * это слепые доски и детский мат в случайном режиме, для языков — серии хаба
 * «Языки» в билингво-режиме, и так далее.
 *
 * ⚠️ ДВА ПРОФИЛЯ ИЗ ПОТОКА ВЫПАДАЮТ, И ЭТО ТОЖЕ ЕГО СЛОВА. Дети «не усидят в
 * поток сами» — им отбираются игровые; пожилым «чистый поток сложно выдержать» —
 * там ищется середина между пользой и привычкой. Это не смягчение задачи, а
 * условие, при котором набор вообще доигрывают.
 */
/**
 * 🔴 МИНУТЫ — ВКЛАДКАМИ И ЗДЕСЬ. Денис 13.09.2026: «просил тут тоже табы сделать
 * 5 10 15 минут». Серий шестьдесят пять, у каждой полтора десятка шагов; списком
 * подряд это простыня на тысячу строк, в которой ничего не найти.
 *
 * ⚠️ ДЛИНА СЧИТАЕТСЯ ПО СУММЕ, А НЕ ПО ИМЕНИ. Имя правится руками, суффикс «· 15
 * мин» у своей серии человек может и не написать — тогда серия исчезла бы из всех
 * вкладок разом. Сумма оценок известна всегда.
 */
let длинаСерий = 5;
const корзинаСерии = (н) => {
  const мин = н.шаги.reduce((с, ш) => с + (ш.est_duration_sec || 0), 0) / 60;
  return мин <= 7.5 ? 5 : мин <= 12.5 ? 10 : 15;
};

function телоНаборы() {
  let html = `<div class="заголовокРаздела">Свои серии — поток</div>`;
  html += `<div class="мелко">Серия-<b>поток</b>: одно узкое умение подряд, 5–15 минут. Назначается профилям галочками —
    в приложении он появится у отмеченных.</div>`;
  /* Считаем по корзинам ДО отбора: иначе на пустой вкладке не видно, где искать. */
  const счёт = { 5: 0, 10: 0, 15: 0 };
  for (const н of правки.наборы) счёт[корзинаСерии(н)]++;
  html += `<div class="мелко" style="margin:8px 0">длина серии: ` + [5, 10, 15].map(l =>
    `<button data-длинасерий="${l}" style="${l === длинаСерий ? 'font-weight:700;text-decoration:underline' : ''}">${l} мин (${счёт[l]})</button>`
  ).join(' ') + `</div>`;
  html += правки.наборы
    .map((н, i) => [н, i])
    .filter(([н]) => корзинаСерии(н) === длинаСерий)
    .map(([н, i]) => {
    const минут = Math.round(н.шаги.reduce((с, ш) => с + (ш.est_duration_sec || 0), 0) / 60);
    const кому = ДАННЫЕ.профили.map(п => {
      const есть = (правки.профили[п.id]?.наборы ?? []).includes(н.id);
      return `<label class="строка" style="display:inline-flex;margin-right:10px">
        <input type="checkbox" ${есть ? 'checked' : ''} data-набордля="${н.id}|${п.id}">
        <span>${п.имя}</span></label>`;
    }).join('');
    return `
    <div class="имяСерии">${н.название || н.id}
      <span class="числа">упражнений ${н.шаги.length} · по оценкам ${минут} мин</span>
      <button data-убратьнабор="${i}">удалить</button></div>
    <div class="мелко" style="margin-bottom:6px">кому показывать: ${кому}</div>
    ${н.шаги.map((ш, j) => нарисоватьШаг(ш, 'набор:' + i, j)).join('')}
    <button data-внабор="${i}">+ упражнение</button>`;
  }).join('') || '<div class="пусто">на эту длину серий нет</div>';
  html += `<div style="margin-top:14px">
    <input type="text" id="имяНабора" placeholder="название новой серии, например «Шахматы: слепой поток»" style="width:340px">
    <button id="кнНовыйНабор">Создать серию</button></div>`;
  return html;
}

/* Состав развилок — ПРОФИЛЬНЫЙ: за карточкой `/games/puzzles-hub` стоят 40 режимов
   Тэтхэма, и отбор по составу игр открывает их скопом. Отдельный список на профиль —
   единственный способ дать детям десять, а взрослым сорок. */
function хабыПрофиля() {
  return правки.профили[текущийПрофиль]?.хабы ?? {};
}

/* Блоки главной: файл умеет только УБРАТЬ блок. Свои условия у блоков остаются
   главнее — иначе получился бы заголовок над пустотой. */
function телоГлавная() {
  const мои = правки.профили[текущийПрофиль]?.главная ?? null;
  let html = `<div class="мелко">Что показывать на главной у профиля «${поId[текущийПрофиль].имя}».
    Снятый блок не рисуется. Включить блок, который и так пуст (например «Рекомендуем сегодня» без рекомендаций), файл не может — он покажется сам, когда будет чем наполниться.</div>`;
  html += `<div class="заголовокРаздела" data-шапкаглавной="1">Блоков включено: ${(мои ?? ДАННЫЕ.блокиГлавной.map(б => б.id)).length} из ${ДАННЫЕ.блокиГлавной.length}</div>`;
  html += ДАННЫЕ.блокиГлавной.map(б => `<label class="строка">
      <input type="checkbox" ${!мои || мои.includes(б.id) ? 'checked' : ''} data-блок="${б.id}">
      <span>${б.подпись}</span><span class="ид">${б.id}</span></label>`).join('');
  return html;
}

/* Баланс — ОБЩИЙ на приложение (экономика одна), а правило уровня — профильное. */
/**
 * СЕРИИ. Решение Дениса 13.09.2026: тащить в редактор.
 * ⚠️ Оговорку держим на виду, а не в переписке: серия — это ЗАМЕР, и смена состава
 * разрывает кривую прогресса. Сравнивать «до» и «после» правки нельзя.
 */
function шагиСерии(id) {
  const с = ДАННЫЕ.серии.find(x => x.id === id);
  return правки.серии[id] ?? (с ? с.шаги.map(ш => {
    const г = ДАННЫЕ.игры.find(x => x.id === ш.game_id);
    return { game_id: ш.game_id, game_route: г ? г.route : '/games/' + ш.game_id,
             est_duration_sec: ш.est_duration_sec || 60 };
  }) : []);
}

function телоСерии() {
  let html = `<div class="мелко">Серия — набор упражнений подряд с одним итогом. Своя серия («поток») заводится здесь
    и назначается профилям галочками; заводские ниже — это ЗАМЕРЫ, у них состав прибит.</div>`;
  html += телоНаборы();
  html += `<div class="заголовокРаздела" style="margin-top:22px">Заводские серии — замер</div>`;
  html += `<div class="мелко" style="border-left:3px solid var(--жёлтый);padding-left:10px">
    ⚠️ Серия — это ЗАМЕР. Меняешь состав — замеры до и после становятся несравнимыми,
    и кривая прогресса на этом месте разрывается. Менять можно, просто знай об этом.</div>`;

  for (const с of ДАННЫЕ.серии) {
    if (с.вид === 'playlist') {
      const шаги = шагиСерии(с.id);
      html += `<div class="заголовокРаздела">${с.подпись} — упражнений ${шаги.length}</div>`;
      html += шаги.map((ш, i) => нарисоватьШаг(ш, 'серия:' + с.id, i)).join('');
      html += `<button data-всерию="${с.id}">+ упражнение</button>`;
    } else {
      const выбраны = правки.блоки[с.id] ?? с.блоки;
      html += `<div class="заголовокРаздела">${с.подпись} — блоков ${выбраны.length} из ${с.блоки.length}</div>
        <div class="мелко">🔴 Это ОДНА игра, а не цепочка разных. Блок — правило внутри неё: в корректурке
        сначала ищешь знак, потом слово, потом смысл — на том же поле букв. Поэтому «+ упражнение» здесь нет:
        добавлять нечего, блоки живут в коде игры. Можно убрать блок или переставить порядок стрелками.</div>`;
      /* Показываем в ТОМ порядке, в котором серия пойдёт, а не в заводском: порядок
         здесь — half смысла правки, и видеть его надо сразу. */
      const поПорядкуБлоки = [...выбраны, ...с.блоки.filter(б => !выбраны.includes(б))];
      if (с.порядокЧастьЗамера) {
        html += `<div class="мелко" style="border-left:3px solid var(--жёлтый);padding-left:10px;margin:6px 0">
          ⚠️ Порядок здесь — часть замера, а не оформление. Серия меряет ЦЕНУ правила
          разностью времён: второй блок имеет смысл только после первого. Переставишь —
          разности начнут мерить другое.</div>`;
      }
      html += поПорядкуБлоки.map((б, i) => {
        const вкл = выбраны.includes(б);
        const номер = вкл ? `${выбраны.indexOf(б) + 1}. ` : '— ';
        const что = (с.чтоМеряют || {})[б];
        return `<label class="строка">
          <input type="checkbox" ${вкл ? 'checked' : ''} data-блок="${с.id}" data-ключ="${б}">
          <span>${номер}<b>${б}</b>${что ? ` <span class="ид">${что}</span>` : ''}</span>
          ${вкл ? `<button class="двиг" data-блоквверх="${с.id}|${б}" title="выше">↑</button>
                  <button class="двиг" data-блоквниз="${с.id}|${б}" title="ниже">↓</button>` : ''}
          </label>`;
      }).join('');
    }
  }
  return html;
}

/**
 * 🔴 УРОВНИ — ОТДЕЛЬНАЯ ВКЛАДКА. Денис 13.09.2026: «по уровням тоже не вижу
 * настройку в редакторе?» Настройка была — первым блоком внутри «Баланса», и
 * найти её не получилось. Разделено: уровни отдельно, экономика отдельно.
 */
function телоУровни() {
  const пр = правки.профили[текущийПрофиль]?.уровень_в_зарядке ?? null;
  const как = пр?.как ?? '';
  const сколько = пр?.сколько ?? 5;
  let html = `<div class="заголовокРаздела">С какого уровня зарядка запускает упражнение · профиль «${поId[текущийПрофиль].имя}»</div>
    <div class="мелко"><b>Как сейчас, пока правило не задано:</b> зарядка НЕ передаёт уровень вовсе — упражнение открывается
    с твоего личного, того самого, до которого ты дошёл. Прошёл Шульте до 20 — в зарядке будет 20, а не 16: никаких «минус
    двадцать процентов» по умолчанию нет.<br>
    <b>Внутри одной зарядки уровень растёт.</b> Уровень считается заново перед каждым шагом, а не один раз на старте: если
    Шульте стоит в наборе пять раз и на первом подходе ты закрыл 16-й, вторым подходом придёт 17-й.<br>
    <b>Прибитый в шаге уровень правило не перебивает</b> — если в упражнении сетки явно записан уровень, идёт он.</div>
    <div class="шаг">
      <select id="какУровень">
        ${[['', 'не задавать — с личного'], ['первый','всегда с первого'], ['освоенный','с освоенного'], ['минус','освоенный минус N уровней'], ['процент','освоенный минус N процентов']]
          .map(([v, п]) => `<option value="${v}" ${v === как ? 'selected' : ''}>${п}</option>`).join('')}
      </select>
      <label class="мелко">сколько <input type="number" id="сколькоУровень" min="0" max="100" value="${сколько}"></label>
      <span class="мелко" id="примерУровня"></span>
    </div>`;
  return html;
}

function телоБаланс() {
  let html = `<div class="заголовокРаздела">Замки: с какого уровня открыт приём</div>`;
  html += ДАННЫЕ.замки.map(з => `<div class="шаг">
      <span style="min-width:130px">${з.key}</span>
      <input type="number" min="1" max="99" value="${правки.замки[з.key] ?? з.level}" data-замок="${з.key}">
      <span class="мелко">заводской: ${з.level}</span></div>`).join('');

  html += `<div class="заголовокРаздела">Коллекция: сколько звёзд стоит фигурка</div>
    <div class="мелко">Пороги обязаны расти: приложение считает «следующую фигурку» по порядку, и список вразнобой оно не примет.</div>`;
  html += ДАННЫЕ.фигурки.map(ф => `<div class="шаг">
      <span style="min-width:130px">${ф.face} ${ф.key}</span>
      <input type="number" min="1" max="999999" value="${правки.коллекция[ф.key] ?? ф.at}" data-фигурка="${ф.key}">
      <span class="мелко">заводской: ${ф.at}</span></div>`).join('');
  return html;
}

function телоХабы() {
  const мои = хабыПрофиля();
  let html = `<div class="мелко">Что показывать внутри развилки у профиля «${поId[текущийПрофиль].имя}» и в каком порядке.
    Придумать новую карточку нельзя — только убрать или переставить. Не тронутая развилка остаётся заводской.</div>`;
  for (const [маршрут, карточки] of Object.entries(ДАННЫЕ.хабы)) {
    const выбрано = мои[маршрут] ?? карточки.map(к => к.route);
    const менялась = мои[маршрут] ? ' •' : '';
    html += `<div class="заголовокРаздела" data-шапкахаба="${маршрут}">
        <label style="display:inline-flex;gap:8px;align-items:center;cursor:pointer;text-transform:none;font-size:12px">
          <input type="checkbox" data-хабцеликом="${маршрут}" ${выбрано.length === карточки.length ? 'checked' : ''}>
          <span>${маршрут} — ${выбрано.length} из ${карточки.length}${менялась}</span>
        </label></div>`;
    html += карточки.map(к => `<label class="строка">
        <input type="checkbox" ${естьВХабе(выбрано, к.route) ? 'checked' : ''}
               data-хаб="${маршрут}" data-карточка="${к.route}">
        <span>${к.имяКлюч}</span><span class="ид">${к.route}</span></label>`).join('');
    /**
     * 🔴 ГОЛОВОЛОМКИ ТЭТХЭМА МОЖНО ПОЛОЖИТЬ В ЛЮБУЮ РАЗВИЛКУ — ФАЙЛОМ.
     * Вопрос Дениса 13.09.2026: «это же фильтр отображения, как и состав профиля,
     * почему нельзя всё править в редакторе». Теперь можно: файл описывает карточку
     * целиком (маршрут + значок + словарные ключи), и правка кода не нужна.
     */
    const свои = ТЭТХЭМА.filter(г => !карточки.some(к => к.route === г.route));
    if (свои.length) {
      const строкаГ = (г) => `<label class="строка">
          <input type="checkbox" ${естьВХабе(выбрано, г.route) ? 'checked' : ''}
                 data-вхаб="${маршрут}" data-режим="${г.режим}">
          <span>${г.имя} — Тэтхэма</span><span class="ид">${г.режим}</span></label>`;
      const взятые = свои.filter(г => естьВХабе(выбрано, г.route));
      const прочие = свои.filter(г => !естьВХабе(выбрано, г.route));
      /**
       * 🔴 ОТМЕЧЕННЫЕ ВИДНЫ, ОСТАЛЬНЫЕ ПОД РАСКРЫВАШКОЙ. Денис 13.09.2026: «редактор
       * показывает, что они все 40 ещё в головоломках Тэтхэма, в других не вижу».
       * Механизм работал — тонул ПОКАЗ: тринадцать развилок печатали по сорок две
       * строки, и три отмеченные терялись среди пятисот.
       */
      if (взятые.length) {
        html += `<div class="мелко" style="margin:6px 0 2px">головоломки Тэтхэма здесь: ${взятые.length}</div>`;
        html += взятые.map(строкаГ).join('');
      }
      if (прочие.length) {
        html += `<details style="margin:4px 0"><summary class="мелко" style="cursor:pointer">
          + добавить головоломку Тэтхэма (${прочие.length})</summary>${прочие.map(строкаГ).join('')}</details>`;
      }
    }
  }
  return html;
}

function нарисовать() {
  нарисоватьПрофили();
  нарисоватьВкладки();
  const тело = document.getElementById('тело');
  тело.innerHTML = вкладка === 'игры' ? телоИгры()
                 : вкладка === 'главная' ? телоГлавная()
                 : вкладка === 'зарядка' ? телоЗарядка()

                 : вкладка === 'серии' ? телоСерии()
                 : вкладка === 'уровни' ? телоУровни()
                 : вкладка === 'баланс' ? телоБаланс()
                 : телоХабы();
  подключитьСобытия();
  нарисоватьИтог();
}

function подключитьСобытия() {
  const тело = document.getElementById('тело');
  тело.querySelectorAll('input[data-игра]').forEach(эл => {
    эл.onchange = () => переключить(текущийПрофиль, эл.dataset.игра);
    /* Наведение и нажатие по строке показывают карточку. Галочку это не трогает:
       обработчик на строке, а не на самом чекбоксе. */
    const строка = эл.closest('.строка');
    if (строка) {
      строка.onmouseenter = () => показатьИгру(эл.dataset.игра);
      строка.onclick = () => показатьИгру(эл.dataset.игра);
    }
  });
  /* Шаг зарядки — тоже игра: показываем ту, что выбрана в списке. */
  тело.querySelectorAll('.шаг select[data-поле="game_id"]').forEach(эл => {
    эл.onfocus = () => показатьИгру(эл.value);
    эл.addEventListener('change', () => показатьИгру(эл.value));
  });
  тело.querySelectorAll('input[data-хабцеликом]').forEach(эл => {
    эл.onchange = () => {
      const м = эл.dataset.хабцеликом;
      const все = ДАННЫЕ.хабы[м].map(к => к.route);
      const мои = (правки.профили[текущийПрофиль] ??= {});
      мои.хабы ??= {};
      if (эл.checked) delete мои.хабы[м];      // весь хаб = заводской состав
      else мои.хабы[м] = [все[0]];             // пустой хаб файл не примет — оставляем один
      нарисовать();
    };
  });
  тело.querySelectorAll('input[data-хаб]').forEach(эл => {
    эл.onchange = () => {
      const м = эл.dataset.хаб;
      const все = ДАННЫЕ.хабы[м].map(к => к.route);
      const мои = (правки.профили[текущийПрофиль] ??= {});
      мои.хабы ??= {};
      const текущ = мои.хабы[м] ?? все;
      мои.хабы[м] = эл.checked
        ? все.filter(r => текущ.includes(r) || r === эл.dataset.карточка)
        : текущ.filter(r => r !== эл.dataset.карточка);
      /* Как и с играми: перерисовываем не список, а только его заголовок со счётом. */
      const з = document.querySelector(`[data-шапкахаба="${м}"]`);
      if (з) з.textContent = `${м} — ${мои.хабы[м].length} из ${все.length} •`;
      нарисоватьПрофили();
      нарисоватьИтог();
    };
  });
  тело.querySelectorAll('input[data-блок]').forEach(эл => {
    эл.onchange = () => {
      const все = ДАННЫЕ.блокиГлавной.map(б => б.id);
      const мои = (правки.профили[текущийПрофиль] ??= {});
      const текущ = мои.главная ?? все;
      мои.главная = эл.checked
        ? все.filter(b => текущ.includes(b) || b === эл.dataset.блок)
        : текущ.filter(b => b !== эл.dataset.блок);
      const з = document.querySelector('[data-шапкаглавной]');
      if (з) з.textContent = `Блоков включено: ${мои.главная.length} из ${все.length}`;
      нарисоватьПрофили();
      нарисоватьИтог();
    };
  });

  тело.querySelectorAll('[data-замок]').forEach(эл => {
    эл.onchange = () => {
      const n = Number(эл.value);
      if (Number.isInteger(n) && n >= 1) правки.замки[эл.dataset.замок] = n;
      нарисоватьИтог();
    };
  });
  тело.querySelectorAll('[data-фигурка]').forEach(эл => {
    эл.onchange = () => {
      const n = Number(эл.value);
      if (Number.isFinite(n) && n >= 1) правки.коллекция[эл.dataset.фигурка] = Math.floor(n);
      проверитьЛестницу();
    };
  });
  const какУр = document.getElementById('какУровень');
  if (какУр) {
    const применить = () => {
      const мои = (правки.профили[текущийПрофиль] ??= {});
      const как = какУр.value;
      const сколько = Number(document.getElementById('сколькоУровень').value) || 0;
      if (!как) delete мои.уровень_в_зарядке;
      else if (как === 'минус' || как === 'процент') мои.уровень_в_зарядке = { как, сколько };
      else мои.уровень_в_зарядке = { как };
      показатьПример();
      нарисоватьПрофили();
      нарисоватьИтог();
    };
    какУр.onchange = применить;
    document.getElementById('сколькоУровень').onchange = применить;
    показатьПример();
  }

  тело.querySelectorAll('input[data-раздел]').forEach(эл => {
    эл.onchange = () => {
      const р = эл.dataset.раздел;
      const включить = эл.checked;
      const было = составПрофиля(текущийПрофиль);
      const список = было === 'all' ? ДАННЫЕ.игры.map(г => г.id) : [...было];
      const набор = new Set(список);
      for (const г of игрыПоРазделам[р]) { if (включить) набор.add(г.id); else набор.delete(г.id); }
      (правки.профили[текущийПрофиль] ??= {}).игры = [...набор];
      /* Галочки строк этого раздела двигаем руками — список не перерисовываем,
         чтобы не терять место прокрутки (та же причина, что и у одиночной галочки). */
      for (const г of игрыПоРазделам[р]) {
        const э = тело.querySelector(`input[data-игра="${г.id}"]`);
        if (э) э.checked = включить;
      }
      обновитьСчётчики();
    };
  });

  const поиск = document.getElementById('поиск');
  if (поиск) поиск.oninput = () => {
    const q = поиск.value.toLowerCase().trim();
    тело.querySelectorAll('.строка').forEach(с => {
      с.style.display = !q || с.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };
  тело.querySelectorAll('[data-обрезать]').forEach(к => {
    к.onclick = (e) => {
      e.preventDefault();
      const [когда, мин] = к.dataset.обрезать.split('|');
      const цель = Number(мин) * 60;
      const собран = []; let сумма = 0;
      for (const ш of шагиПрофиля(когда)) {
        if (собран.length && сумма + (ш.est_duration_sec || 60) > цель) break;
        собран.push(ш); сумма += ш.est_duration_sec || 60;
      }
      (правки.профили[текущийПрофиль] ??= {})[когда] = собран;
      нарисовать();
    };
  });
  тело.querySelectorAll('[data-намин]').forEach(к => {
    к.onclick = (e) => {
      e.preventDefault();
      const [когда, мин] = к.dataset.намин.split('|');
      const ф3 = поId[текущийПрофиль].сейчас || {};
      const источник = (когда === 'утро' ? ф3['утро' + утроМинут] : ф3[когда]) || [];
      /* Набираем по порядку, пока не перевалили за цель: порядок в наборе осмыслен
         (разминка идёт от лёгкого), и выдёргивать из середины нельзя. */
      const цель = Number(мин) * 60;
      const собран = [];
      let сумма = 0;
      for (const ш of источник) {
        if (собран.length && сумма + (ш.est_duration_sec || 60) > цель) break;
        собран.push(ш); сумма += ш.est_duration_sec || 60;
      }
      (правки.профили[текущийПрофиль] ??= {})[когда] = собран.map(ш => {
        const г = ДАННЫЕ.игры.find(x => x.id === ш.game_id);
        return { game_id: ш.game_id, game_route: г ? г.route : '/games/' + ш.game_id,
                 est_duration_sec: ш.est_duration_sec || 60 };
      });
      нарисовать();
    };
  });
  тело.querySelectorAll('input[data-вхаб]').forEach(эл => {
    эл.onchange = () => {
      const хаб = эл.dataset.вхаб, режим = эл.dataset.режим;
      const г = ТЭТХЭМА.find(x => x.режим === режим);
      const мои = (правки.профили[текущийПрофиль] ??= {});
      const текущий = мои.хабы?.[хаб] ?? (ДАННЫЕ.хабы[хаб] || []).map(к => к.route);
      const без = текущий.filter(э => маршрутЭлемента(э) !== г.route);
      /* Карточка описывается ЦЕЛИКОМ: маршрут, значок и словарные ключи — иначе в
         приложении на её месте было бы пустое место. */
      const стало = эл.checked
        ? [...без, { маршрут: г.route, значок: 'extension-puzzle', имя: г.имяКлюч, описание: г.описаниеКлюч }]
        : без;
      (мои.хабы ??= {})[хаб] = стало;
      нарисовать();
    };
  });
  тело.querySelectorAll('input[data-головоломка]').forEach(эл => {
    эл.onchange = () => {
      /* Снимаем из ТОЙ развилки, где головоломка лежит: после раскладки по темам
         это уже не обязательно «Головоломки» — может быть судоку или счёт. */
      const маршрут = эл.dataset.головоломка;
      const хаб = эл.dataset.вхабе || РАЗВИЛКА_ГОЛОВОЛОМОК;
      const мои = (правки.профили[текущийПрофиль] ??= {});
      const текущий = мои.хабы?.[хаб] ?? (ДАННЫЕ.хабы[хаб] || []).map(к => к.route);
      (мои.хабы ??= {})[хаб] = текущий.filter(э => маршрутЭлемента(э) !== маршрут);
      нарисовать();
    };
  });
  тело.querySelectorAll('input[data-набордля]').forEach(эл => {
    эл.onchange = () => {
      const [idНабора, idПрофиля] = эл.dataset.набордля.split('|');

  тело.querySelectorAll('[data-добавить]').forEach(к => {

  тело.querySelectorAll('.шаг').forEach(узел => {

    /* ⚠️ Класс `шаг` носят и НЕ-шаги: строка правила уровня, строки замков и
       фигурок. Раньше это сходило с рук, потому что адрес читался лениво, внутри
       обработчика; теперь он нужен сразу — и на первой же такой строке разбор
       падал с «Cannot read properties of undefined». */
    if (!когда) return;
    const клетка = когда.startsWith('сетка:') ? когда.slice(6).split('|') : null;
    const взять = () => клетка
      ? [...шагиСетки(Number(клетка[0]), клетка[1], Number(клетка[2]))]
      : когда.startsWith('серия:')

      : когда.startsWith('набор:')
      ? правки.наборы[Number(когда.split(':')[1])].шаги
      : когда.startsWith('день:')
      ? [...шагиПоДню(Number(когда.split(':')[1]))]
      : [...шагиПрофиля(когда)];
    const положить = (шаги) => {
      if (клетка) положитьВСетку(Number(клетка[0]), клетка[1], Number(клетка[2]), шаги);
      else if (когда.startsWith('серия:')) правки.серии[когда.slice(6)] = шаги;
      else if (когда.startsWith('набор:')) правки.наборы[Number(когда.split(':')[1])].шаги = шаги;
      else if (когда.startsWith('день:')) {
        const мои = (правки.профили[текущийПрофиль] ??= {});
        (мои.по_дням ??= {})[Number(когда.split(':')[1])] = шаги;
      } else (правки.профили[текущийПрофиль] ??= {})[когда] = шаги;
      нарисовать();
    };
    узел.querySelectorAll('[data-поле]').forEach(поле => {
      поле.onchange = () => {
        const шаги = взять();
        const ш = { ...шаги[и] };
        const имя = поле.dataset.поле;
        if (имя === 'game_id') {
          /* `puzzles:Net` → игра `puzzles` плюс режим `Net`: приложение знает
             именно такую пару, виртуальный id живёт только в редакторе. */
          const г = ВСЕ_ИГРЫ.find(x => x.id === поле.value);
          ш.game_id = г && г.реальный ? г.реальный : поле.value;
          if (г && г.режим) ш.mode = г.режим; else if (ш.game_id !== шаг.game_id) delete ш.mode;
          /* Маршрут — без «?mode=»: режим едет отдельным полем, а приложение
             всё равно берёт маршрут из каталога (см. `отобратьШаги`). Запрос в
             маршруте был бы вторым написанием одного и того же. */
          ш.game_route = ((г || {}).route || ш.game_route || '').split('?')[0];
        } else if (имя === 'difficulty') {
          if (поле.value) ш.difficulty = поле.value; else delete ш.difficulty;
        } else {
          const ч = Number(поле.value);
          if (Number.isFinite(ч) && ч > 0) ш[имя] = ч; else delete ш[имя];
        }
        шаги[и] = ш;
        положить(шаги);
      };
    });
    const убрать = узел.querySelector('[data-убрать]');
    if (убрать) убрать.onclick = () => { const ш = взять(); ш.splice(и, 1); положить(ш); };
  });
  const новый = document.getElementById('кнНовыйНабор');
  if (новый) новый.onclick = () => {
    const имя = (document.getElementById('имяНабора').value || '').trim();
    if (!имя) return;
    правки.наборы.push({
      id: 'набор-' + (правки.наборы.length + 1),
      название: имя,
      шаги: [{ game_id: ДАННЫЕ.игры[0].id, game_route: ДАННЫЕ.игры[0].route, est_duration_sec: 60 }],
    });
    нарисовать();
  };
  тело.querySelectorAll('[data-убратьнабор]').forEach(к => {
    к.onclick = () => { правки.наборы.splice(Number(к.dataset.убратьнабор), 1); нарисовать(); };
  });
  тело.querySelectorAll('[data-внабор]').forEach(к => {
    к.onclick = () => {
      const н = правки.наборы[Number(к.dataset.внабор)];
      н.шаги.push({ game_id: ДАННЫЕ.игры[0].id, game_route: ДАННЫЕ.игры[0].route, est_duration_sec: 60 });
      нарисовать();
    };
  });
}

             : пр.как === 'освоенный' ? ОСВОЕНО

/* ── файл настроек ─────────────────────────────────────────────────────────── */
function собратьФайл() {
  const файл = { app: 'PsyGames-Playlists', format: 1, exported_at: new Date().toISOString(), профили: {} };
  for (const [ид, п] of Object.entries(правки.профили)) if (Object.keys(п).length) файл.профили[ид] = п;
  if (правки.наборы.length) файл.наборы = правки.наборы;
  /* В файл идёт только РАЗНИЦА с заводским: совпавшее число заморозило бы баланс,
     который позже поменяют в сборке. */
  const замки = {}, коллекция = {};
  for (const з of ДАННЫЕ.замки) if (правки.замки[з.key] !== undefined && правки.замки[з.key] !== з.level) замки[з.key] = правки.замки[з.key];
  for (const ф of ДАННЫЕ.фигурки) if (правки.коллекция[ф.key] !== undefined && правки.коллекция[ф.key] !== ф.at) коллекция[ф.key] = правки.коллекция[ф.key];
  if (правки.порядок && правки.порядок.length) файл.порядок_профилей = правки.порядок;
  if (Object.keys(правки.серии).length) файл.серии = правки.серии;
  const блоки = {};
  for (const с of ДАННЫЕ.серии) {
    const мои = правки.блоки[с.id];
    if (мои && (мои.length !== с.блоки.length || мои.some((б, i) => б !== с.блоки[i]))) блоки[с.id] = мои;
  }
  if (Object.keys(блоки).length) файл.блоки = блоки;
  if (Object.keys(замки).length) файл.замки = замки;
  if (Object.keys(коллекция).length) файл.коллекция = коллекция;
  /* Развилка, совпавшая с заводской, в файл не пишется: файл должен содержать
     РАЗНИЦУ, иначе он тихо заморозит состав, который позже поменяют в сборке. */
  for (const п of Object.values(файл.профили)) {
    if (п.главная && п.главная.length === ДАННЫЕ.блокиГлавной.length) delete п.главная;
    if (!п.хабы) continue;
    for (const [м, список] of Object.entries(п.хабы)) {
      const заводской = ДАННЫЕ.хабы[м].map(к => к.route);
      if (список.length === заводской.length && список.every((r, i) => r === заводской[i])) delete п.хабы[м];
    }
    if (!Object.keys(п.хабы).length) delete п.хабы;
  }
  return JSON.stringify(файл, null, 2);
}

/* ─────────────────────────────────────────────────────────────────────────────
 * СОХРАНЕНИЕ В ОДИН И ТОТ ЖЕ ФАЙЛ — без диалога на каждый раз.
 *
 * Просьба Дениса: «сделай кнопку сохранить, чтобы не возиться с путём каждый раз,
 * чтобы клал рядом с ним». Страница открыта с диска, и писать куда попало браузер
 * не даст — но File System Access API разрешает СПРОСИТЬ МЕСТО ОДИН РАЗ и дальше
 * писать в тот же файл молча.
 *
 * Разрешение живёт в объекте-указателе, а он переживает перезагрузку только в
 * IndexedDB (в localStorage такие объекты не кладутся — там лишь строки). Поэтому
 * указатель хранится в маленькой базе рядом со страницей.
 *
 * ⚠️ В Safari этого API нет. Там кнопка честно откатывается на скачивание в
 * Загрузки и говорит об этом, а не притворяется, что сохранила.
 * ───────────────────────────────────────────────────────────────────────────── */
const БАЗА = 'psygames-editor', ХРАНИЛИЩЕ = 'указатели', КЛЮЧ = 'файл-настроек';

function открытьБазу() {
  return new Promise((ок, нет) => {
    const з = indexedDB.open(БАЗА, 1);
    з.onupgradeneeded = () => з.result.createObjectStore(ХРАНИЛИЩЕ);
    з.onsuccess = () => ок(з.result);
    з.onerror = () => нет(з.error);
  });
}

async function взятьУказатель() {
  try {
    const db = await открытьБазу();
    return await new Promise((ок) => {
      const з = db.transaction(ХРАНИЛИЩЕ, 'readonly').objectStore(ХРАНИЛИЩЕ).get(КЛЮЧ);
      з.onsuccess = () => ок(з.result || null);
      з.onerror = () => ок(null);
    });
  } catch { return null; }
}

async function запомнитьУказатель(у) {
  try {
    const db = await открытьБазу();
    db.transaction(ХРАНИЛИЩЕ, 'readwrite').objectStore(ХРАНИЛИЩЕ).put(у, КЛЮЧ);
  } catch {}
}

/** Разрешение может истечь — тогда браузер спросит заново, и это нормально. */
async function естьРазрешение(у) {
  try {
    if ((await у.queryPermission({ mode: 'readwrite' })) === 'granted') return true;
    return (await у.requestPermission({ mode: 'readwrite' })) === 'granted';
  } catch { return false; }
}

function скачать() {
  const b = new Blob([собратьФайл()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'psygames-playlists.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function сохранить() {
  if (!window.showSaveFilePicker) {
    скачать();
    alert('Этот браузер не умеет сохранять в один и тот же файл — положил в Загрузки.\nВ Chrome кнопка «Сохранить» спросит место один раз и дальше будет писать туда молча.');
    return;
  }
  try {
    let у = await взятьУказатель();
    if (у && !(await естьРазрешение(у))) у = null;
    if (!у) {
      у = await window.showSaveFilePicker({
        suggestedName: 'psygames-playlists.json',
        types: [{ description: 'Настройки PsyGames', accept: { 'application/json': ['.json'] } }],
      });
      await запомнитьУказатель(у);
    }
    const п = await у.createWritable();
    await п.write(собратьФайл());
    await п.close();
    сказатьКуда(у.name, true);
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // передумал — молча
    скачать();
    alert('Сохранить в выбранный файл не вышло (' + (e?.message || e) + ') — положил в Загрузки.');
  }
}

let времяСообщения = 0;
function сказатьКуда(имя, толькоЧто) {
  const у = document.getElementById('куда');
  if (!у) return;
  у.textContent = толькоЧто ? `сохранено → ${имя}` : `сохраняю в ${имя}`;
  clearTimeout(времяСообщения);
  if (толькоЧто) времяСообщения = setTimeout(() => сказатьКуда(имя, false), 2500);
}

document.getElementById('кнСохранить').onclick = сохранить;

/* ─────────────────────────────────────────────────────────────────────────────
 * 🔴 ПРАВКИ НЕ ТЕРЯЮТСЯ ПРИ ПЕРЕЗАГРУЗКЕ СТРАНИЦЫ.
 *
 * Денис 13.09.2026: «страницу перезагрузил — всё скинулось, что сохранял». Правки
 * жили только в памяти вкладки, а `Cmd+R` её очищает. Файл при этом был сохранён,
 * но редактор его не читал — открывался пустым поверх настоящей работы.
 *
 * Две страховки, и нужны обе:
 *  1) ЧЕРНОВИК в localStorage — пишется при каждой правке. Спасает даже тогда,
 *     когда файл ещё ни разу не выбирали.
 *  2) ЧТЕНИЕ ФАЙЛА по сохранённому указателю — источник истины. Если файл есть,
 *     он главнее черновика: в нём то, что человек осознанно сохранил.
 * ───────────────────────────────────────────────────────────────────────────── */
const ЧЕРНОВИК = 'psygames-editor-черновик';

/**
 * 🔴 ЧЕРНОВИК НЕ ПИШЕТСЯ, ПОКА НЕ ПРОЧИТАН.
 *
 * Первая редакция теряла работу ровно на этом: страница рисуется синхронно, а
 * восстановление асинхронно (ждёт указатель на файл). Пустой итог первой отрисовки
 * успевал записать ПУСТОЙ черновик поверх настоящего — и восстанавливать было уже
 * нечего. Замер: после перезагрузки «профилей в черновике: 0» при сделанной правке.
 *
 * Поэтому запись открывается только после того, как восстановление отработало.
 */
let можноПисатьЧерновик = false;

function сохранитьЧерновик() {
  if (!можноПисатьЧерновик) return;
  try { localStorage.setItem(ЧЕРНОВИК, собратьФайл()); } catch {}
}

function применитьФайл(п, откуда) {
  if (!п || п.app !== 'PsyGames-Playlists') return false;
  правки.профили = п.профили || {};
  правки.наборы = п.наборы || [];
  правки.замки = п.замки || {};
  правки.коллекция = п.коллекция || {};
  правки.серии = п.серии || {};
  правки.блоки = п.блоки || {};
  правки.порядок = п.порядок_профилей || null;
  нарисовать();
  const у = document.getElementById('куда');
  if (у && откуда) у.textContent = откуда;
  return true;
}

async function восстановить() {
  const у = await взятьУказатель();
  if (у) {
    сказатьКуда(у.name, false);
    try {
      if (await естьРазрешение(у)) {
        const текст = await (await у.getFile()).text();
        if (текст.trim() && применитьФайл(JSON.parse(текст))) return;   // `finally` ниже откроет запись
      }
    } catch {}
  }
  try {
    const ч = localStorage.getItem(ЧЕРНОВИК);
    if (ч) применитьФайл(JSON.parse(ч), 'восстановлено из черновика — нажми «Сохранить»');
  } catch {}
}

/* Сначала читаем, потом разрешаем писать. Порядок здесь и есть вся защита. */
восстановить().finally(() => { можноПисатьЧерновик = true; });

document.getElementById('кнСкачать').onclick = скачать;

document.getElementById('кнБуфер').onclick = async () => {
  /* Буфер нужен для сборки под Tauri: там импорт читает именно его. */
  try { await navigator.clipboard.writeText(собратьФайл()); alert('Скопировано. В приложении: Настройки → Загрузить состав из файла'); }
  catch { alert('Браузер не дал доступ к буферу — скачайте файл кнопкой рядом'); }
};

document.getElementById('кнЗагрузить').onclick = () => {
  const вход = document.createElement('input');
  вход.type = 'file'; вход.accept = 'application/json,.json';
  вход.onchange = async () => {
    const ф = вход.files?.[0]; if (!ф) return;
    try {
      const п = JSON.parse(await ф.text());
      if (п.app !== 'PsyGames-Playlists') { alert('Это файл другого рода: ' + п.app); return; }
      правки.профили = п.профили || {};
      правки.наборы = п.наборы || [];
      правки.замки = п.замки || {};
      правки.серии = п.серии || {};
      правки.блоки = п.блоки || {};
      правки.коллекция = п.коллекция || {};
      нарисовать();
    } catch (e) { alert('Не удалось прочитать файл: ' + e.message); }
  };
  вход.click();
};

нарисовать();
</script>
