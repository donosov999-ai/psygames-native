name: practice_kit
description: "Practice engine, catalog, haptics and step guidance shared by PsyGames and Smart Alarm."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/practices.json
  plugin:
    platforms:
      android:
        package: pro.psygames.practice_kit
        pluginClass: PracticeKitPlugin
      ios:
        pluginClass: PracticeKitPlugin
