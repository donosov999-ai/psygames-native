name: psygames_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  shared_preferences: ^2.5.5
  ffi: ^2.1.4
  # Шахматные правила «Детского мата»: законные ходы, SAN, мат. Чистый Dart без
  # нативной части и без зависимостей — MIT. В вебе ту же работу делает chess.js
  # (BSD-2), своего движка правил в приложении нет и писать его незачем.
  bishop: ^1.4.4
  # SVG: фигуры Cburnett «Детского мата» — тем же набором, что в вебе (BSD-3);
  # картинки шагов «Паузы», выгруженные рисовалками веб-зарядки
  # (flutter/tools/export-pause.cjs). Тот же пакет у «Умного будильника».
  # ⚠️ Добавлен в main и в ветке «Паузы» независимо — при слиянии строка
  # задвоилась («Duplicate mapping key»), оставлена одна.
  flutter_svg: ^2.2.1
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  # 🔴 Забрать прогресс ПРЕЖНЕЙ версии из контейнера приложения (lib/shell/legacy_import.dart).
  # Tauri-сборка держала его в localStorage WKWebView, а это обычный sqlite внутри
  # нашего же контейнера. Без чтения этих файлов человек после обновления видит нули.
  path_provider: ^2.1.5
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.41
  # 🔴 Практики «Паузы» — ОБЩИЙ пакет с «Умным будильником» (packages/practice_kit):
  # ядро, каталог, вибрация с нативной частью, панель «что делать сейчас», режимы
  # глаз и массаж лица. Решение Дениса 02.10.2026: «чиню один раз — и там, и там».
  practice_kit:
    path: ../packages/practice_kit
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  webview_flutter_platform_interface: ^2.15.1
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Значки приложения iOS / Android / macOS — из одного исходника `store/appstore/icon-1024-noalpha.png`
  # (решение Дениса 18.09.2026). Конфиг — flutter_launcher_icons.yaml, запуск — tool/gen_app_icons.sh.
  flutter_launcher_icons: ^0.14.4
  # Сторож значков (test/app_icon_is_ours_test.dart) читает PNG — та же библиотека, что у генератора.
  image: ^4.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Значки веба — ТЕМ ЖЕ шрифтом Ionicons (`@expo/vector-icons`), а не похожими Material:
  # главные экраны переносятся без подмены рисунка (правило Дениса 4e679f41). Шрифт и таблица
  # кодов (`lib/shell/ionicons.g.dart`) выгружаются сторожем `flutter-ionicons-fresh`.
  fonts:
    - family: Ionicons
      fonts:
        - asset: assets/fonts/Ionicons.ttf

  # 🔴 КАЖДЫЙ КАТАЛОГ ОБЪЯВЛЯЕТСЯ ПОИМЁННО, ВКЛЮЧАЯ ВЛОЖЕННЫЕ.
  #
  # 📍 Строка вида `- assets/words/` берёт ТОЛЬКО файлы самой папки: вложенные
  # каталоги молча не попадают в сборку, а сборка при этом ЗЕЛЁНАЯ. Денис на
  # этом потерял заход 23.09.2026 — получил 17,9 МБ вместо 101,5 и заметил
  # только по несоответствию размера, потому что ни одной ошибки не было.
  #
  # ⚠️ Поэтому добавил каталог — добавь строку ЗДЕСЬ и прогоняй
  # `test/assets_bundled_test.dart`: он сверяет файлы на диске с тем, что
  # реально попало в сборку, и краснеет на пропущенном каталоге.
  assets:
    - assets/levels/
    - assets/digits/candy/
    - assets/digits/elegant/
    - assets/digits/neon/
    - assets/digits/pastel/
    - assets/digits/rainbow/
    - assets/hubs.json
    - assets/game_suites.json
    # Каталог «Игры» — выгрузка games.ts (frontend/src/__tests__/flutter-catalog-asset-fresh.test.ts).
    - assets/catalog.json
    # Правила нижней полосы — выгрузка tabBar.ts (frontend/src/__tests__/flutter-tabs-asset-fresh.test.ts).
    - assets/tabs.json
    - assets/web_theme.json
    - assets/game_help_routes.json
    # Вид приложения (цвета тем, тема профиля, акценты магазина) — выгрузка веба
    # (flutter/tools/embed-look.mjs), не править руками.
    - assets/look.json
    # Профили для настроек — выгрузка живого TS, сторож frontend/src/__tests__/flutter-profiles-asset-fresh.test.ts
    - assets/profiles.json
    # «Источники» — данные веба для модели на Dart (tools/embed-sources.mjs, вариант Б).
    - assets/sources.json
    # Лиги и рамки — таблицы веба для модели «Лиг» на Dart (tools/embed-progression.mjs, вариант Б).
    - assets/progression.json
    # Даты календаря серии на 12 языках — шаблоны ICU (tools/embed-calendar.mjs, вариант Б).
    - assets/calendar_locales.json
    # Фигурки коллекции — таблица веба для модели на Dart (tools/embed-collection.mjs, вариант Б).
    - assets/collection.json
    # Иконки игр «поле в миниатюре» для строк развилок — выгрузка веб-реестра
    # (flutter/tools/embed-game-icons.mjs), не править руками.
    - assets/game_icons/
    # Превью игр фоном плиток вкладки «Игры» — копия веба (`flutter-catalog-asset-fresh.test.ts`), не править руками.
    - assets/game_thumbs/
    - assets/level_rules.json
    # Корпус позиций «Доски в уме»: 2000 задач Lichess (CC0). Каталог объявлен
    # ПОИМЁННО — строка вида «- assets/x/» берёт только файлы самой папки, и
    # вложенные каталоги молча не попадают в сборку («Слова» на этом потеряли
    # заход: 17,9 МБ вместо 101,5, а сборка была зелёной).
    - assets/chess_blind/
    # Фигуры Cburnett (BSD-3), извлечены из frontend/src/games/chess-blind/core/pieces.ts
    - assets/chess/
    # Корпус «Детского мата»: 718 своих матовых позиций + задачи Lichess (CC0)
    - assets/scholars_mate/
    # «Найди ход»: 3 108 задач Lichess (CC0) по двенадцати приёмам, 430 КБ;
    # генератор tools/find_move_corpus.py
    - assets/find_move/
    # «Шахматный пасьянс»: 720 досок 4×4, генератор tools/solitaire_chess_corpus.py
    - assets/solitaire_chess/
    - assets/knights_queens/
    - assets/faces-names.json
    - assets/memory-palace.json
    - assets/rmet.json
    - assets/word-pairs.json
    - assets/mnemonics.json
    - assets/rmet/
    - assets/words/
    - assets/rings/
    - assets/l10n/
    - assets/puzzles/
    - assets/voice/
    - assets/spatial/
    - assets/pause/
    - assets/eye_stereograms/
    - assets/goods/
    - assets/tubes/
    - assets/balls/
    - assets/nuts/
    - assets/cake/tops/
    - assets/cake/plates/
    - assets/pizza/tops/
    - assets/pizza/boards/
    - assets/vocab/
    - assets/reading_span/
    - assets/pairs/
    - assets/pairs/animals/
    - assets/pairs/bio/
    - assets/pairs/biz/
    - assets/pairs/brain/
    - assets/pairs/car/
    - assets/pairs/chess/
    - assets/pairs/coz/
    - assets/pairs/edu/
    - assets/pairs/geo/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
