name: App Store — отправить готовую сборку на проверку

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия; пусто — из frontend/app.json'
        required: false
        default: ''
      build_number:
        description: 'Номер уже загруженной сборки TestFlight'
        required: true
      confirm:
        description: 'Для отправки: submit-<версия>. Пусто — только проверка'
        required: false
        default: ''

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Разложить ключ API
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8
      - name: Проверить или отправить версию
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPSTORE_VERSION: ${{ inputs.version }}
          APPSTORE_BUILD_NUMBER: ${{ inputs.build_number }}
          APPSTORE_CONFIRM: ${{ inputs.confirm }}
        run: node scripts/appstore-submit.mjs
      - name: Стереть ключ
        if: always()
        run: rm -rf ~/private_keys
