name: TestFlight → обновить «Что тестировать» (без новой сборки)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия сборки, например 2.72.0'
        required: true
      build:
        description: 'Номер сборки, например 122'
        required: true
      notes:
        description: 'Что тестировать en-US — одной строкой, для людей'
        required: true
      notes_ru:
        description: 'Что тестировать ru-RU — одной строкой, для людей'
        required: false
        default: ''

jobs:
  localize:
    name: Локализовать существующую сборку
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Разложить ключ API
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8
      - name: Обновить локализованные заметки
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_FILE: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          BUNDLE_ID: com.psygames.app
          WHAT_TO_TEST: ${{ inputs.notes }}
          WHAT_TO_TEST_RU: ${{ inputs.notes_ru }}
        run: |
          python3 -m venv "$RUNNER_TEMP/tfenv"
          "$RUNNER_TEMP/tfenv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          "$RUNNER_TEMP/tfenv/bin/python" flutter/tool/testflight_assign.py --localize "${{ inputs.version }}" "${{ inputs.build }}"
      - name: Стереть ключ
        if: always()
        run: rm -rf ~/private_keys
