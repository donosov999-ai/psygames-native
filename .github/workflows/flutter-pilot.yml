# Пилот переезда на Flutter — свои пробы и свои сборки.
#
# 🔴 РАБОТАЕТ ТОЛЬКО ПО СВОЕЙ ПАПКЕ. Фильтр `paths` стоит нарочно: пилот лежит в
# общем репозитории, и без фильтра каждая правка любого раздела гоняла бы сборку
# Flutter впустую. Обычный выпуск (build.yml) о пилоте не знает и не трогается.
#
# Зачем Android здесь: вес и холодный старт нынешней версии против Flutter надо
# мерить на ОДНОМ телефоне, а Android SDK на маке не стоит. Сборку делает CI,
# числа снимаются с телефона (`adb shell am start -W`, медиана пяти запусков).
name: Пилот Flutter (пробы + сборка Android)

# ⚠️ Пути — не только flutter/**: словари, развилки и режимы головоломок во Flutter СОБИРАЮТСЯ
# из этих веб-исходников (гейт «сгенерированное совпадает с исходниками» ниже). PR, правящий один
# веб-словарь или экран веба, иначе прошёл бы мимо проверки — так расходились словари 30.09.2026.
on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - 'packages/practice_kit/**'
      - '.github/workflows/flutter-pilot.yml'
      - 'frontend/src/contexts/LanguageContext.tsx'
      - 'frontend/src/contexts/translations/**'
      - 'frontend/src/constants/defaultPlaylists.json'
      - 'frontend/src/constants/hubContents.ts'
      - 'frontend/src/games/tatham-bridge/sections/**'
      - 'frontend/app/games/**'
  pull_request:
    paths:
      - 'flutter/**'
      - 'packages/practice_kit/**'
      - '.github/workflows/flutter-pilot.yml'
      - 'frontend/src/contexts/LanguageContext.tsx'
      - 'frontend/src/contexts/translations/**'
      - 'frontend/src/constants/defaultPlaylists.json'
      - 'frontend/src/constants/hubContents.ts'
      - 'frontend/src/games/tatham-bridge/sections/**'
      - 'frontend/app/games/**'
  workflow_dispatch:

concurrency:
  group: flutter-pilot-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: flutter

jobs:
  probes:
    name: Пробы и анализатор
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get

      # 🔴 ДВИЖОК ТЭТХЭМА СОБИРАЕТСЯ ЗДЕСЬ, ИНАЧЕ ТРИ ПРОБЫ ПАДАЮТ НА CI.
      #
      # `puzzles_engine_test`, `puzzles_frame_test` и `puzzles_screen_test` зовут
      # НАСТОЯЩИЙ движок через dart:ffi, а не заглушку — в этом и смысл. Локально
      # библиотека лежит в build/tatham после tool/build_tatham.sh, а на CI её
      # не было: 105 149 строк C живут в каноне Саймона Тэтхэма, вне нашего
      # репозитория. Замер 23.09.2026: main покраснел ровно на этом, три пробы
      # упали в setUpAll, остальные 553 прошли.
      #
      # ⚠️ Канон берётся ПО МЕТКЕ КОММИТА, а не с ветки: движок обновляется
      # своей жизнью, и «свежий master» означал бы, что наши эталоны разъезжаются
      # молча, без единой нашей правки.
      - name: Канон Тэтхэма (по метке) и сборка движка
        run: |
          set -eu
          TATHAM_SHA=428913c6a58b60802fe5d734d9a44c34159f4e0f
          git clone --quiet https://git.tartarus.org/simon/puzzles.git "$HOME/puzzles"
          git -C "$HOME/puzzles" checkout --quiet "$TATHAM_SHA"
          echo "канон: $(git -C "$HOME/puzzles" rev-parse --short HEAD) · $(git -C "$HOME/puzzles" log -1 --format=%ad --date=short)"
          PUZZLES_SRC="$HOME/puzzles" tool/build_tatham.sh
          ls -l build/tatham/

      # 🔴 СГЕНЕРИРОВАННОЕ ОБЯЗАНО СОВПАДАТЬ С ИСХОДНИКАМИ.
      #
      # Словари, развилки и режимы головоломок во Flutter — ВЫГРУЗКА из веб-исходников.
      # Слияние двух веток склеивает сгенерированный JSON «чисто», но неверно: 30.09.2026
      # после #63 экран «Диктанта» звал пять ключей, которых в словарях main не было, —
      # человек увидел бы сырые ключи. В тот же день так же расходились #10, #44, #57, #64.
      # Проверка — пересобрать и сравнить: генераторы на одном node, без зависимостей, и
      # повторный прогон не меняет ни байта (замер 30.09).
      - name: Сгенерированное совпадает с исходниками
        run: |
          node tools/embed-hubs.mjs > /dev/null
          node tools/embed-puzzle-modes.mjs > /dev/null
          node tools/embed-puzzle-routes.mjs > /dev/null
          node tools/embed-l10n.mjs > /dev/null
          if ! git diff --quiet -- assets/hubs.json assets/puzzles/modes.json assets/l10n lib/shell/puzzle_routes.g.dart; then
            git diff --stat -- assets/hubs.json assets/puzzles/modes.json assets/l10n lib/shell/puzzle_routes.g.dart
            echo "::error title=Сгенерированное устарело::пересобери: cd flutter && node tools/embed-hubs.mjs && node tools/embed-puzzle-modes.mjs && node tools/embed-puzzle-routes.mjs && node tools/embed-l10n.mjs — и закоммить"
            exit 1
          fi

      - name: Анализатор — чисто
        run: flutter analyze
      - name: Пробы — все зелёные
        run: flutter test --reporter expanded
      # Практики — общий пакет с «Умным будильником» (packages/practice_kit): ядро,
      # каталог, вибрация с нативной частью. Его пробы — здесь же: починка пакета
      # уходит в оба приложения, и проверяться должна до слияния, а не после.
      - name: Пакет practice_kit — анализатор и пробы
        working-directory: packages/practice_kit
        run: |
          flutter pub get
          flutter analyze
          flutter test --reporter expanded

  android:
    name: Сборка Android (вес для замера)
    needs: probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # 🔴 ДВИЖОК ТЭТХЭМА ПОД ANDROID — .so на каждую архитектуру, ДО сборки APK.
      #
      # На Android библиотека открывается ПО ИМЕНИ из lib/<abi>/, поэтому её надо
      # положить в jniLibs заранее: Flutter заберёт сама. Если этого шага нет,
      # APK соберётся зелёным, а экран головоломок упадёт на первом ходе у
      # человека — Dart не найдёт libtatham.so.
      #
      # Канон берётся ТОЙ ЖЕ меткой, что в пробах (сторож tatham_pin_matches_test):
      # разойдутся — соберём сборку на другом движке, чем проверяли.
      - name: Канон Тэтхэма и движок под Android
        run: |
          set -eu
          TATHAM_SHA=428913c6a58b60802fe5d734d9a44c34159f4e0f
          [ -d "$HOME/puzzles" ] || git clone --quiet https://git.tartarus.org/simon/puzzles.git "$HOME/puzzles"
          git -C "$HOME/puzzles" checkout --quiet "$TATHAM_SHA"
          echo "NDK: ${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-не задан}}"
          ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}" tool/build_tatham_android.sh

      - name: APK (release, без подписи)
        run: flutter build apk --release
      # 🔴 ИТОГОВЫЙ РЕЛИЗНЫЙ МАНИФЕСТ ДАЁТ ВЕБ-ЧАСТИ ПОДНЯТЬСЯ. Два дефекта одного выпуска
      # (01.10.2026), оба невидимы в отладке и в пробах:
      #   · нет INTERNET — AssetServer не откроет сокет на 127.0.0.1, падение на старте;
      #   · нет networkSecurityConfig — релизный WebView отказывает в открытом http даже на
      #     127.0.0.1 («net::ERR_CLEARTEXT_NOT_PERMITTED»), пустой экран (#88).
      # Шаблон Flutter кладёт INTERNET только в debug/profile, поэтому читаем тот манифест,
      # что уходит в APK, — после слияния манифестов плагинов.
      - name: Релизный манифест — сеть и петлевой http разрешены
        run: |
          set -eu
          M=build/app/intermediates/packaged_manifests/release/processReleaseManifestForPackage/AndroidManifest.xml
          [ -f "$M" ] || M=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -1)
          if [ -z "$M" ] || [ ! -f "$M" ]; then
            echo "::error title=Манифест::не найден итоговый релизный манифест"; exit 1
          fi
          echo "манифест: $M"
          grep -o 'uses-permission android:name="[^"]*"' "$M" | sort -u
          grep -q 'android.permission.INTERNET' "$M" \
            || { echo "::error title=Сеть::в релизном манифесте нет INTERNET — приложение упадёт на старте"; exit 1; }
          NSC=$(grep -o 'android:networkSecurityConfig="[^"]*"' "$M" | head -1 || true)
          echo "сетевая политика: ${NSC:-нет}"
          [ -n "$NSC" ] \
            || { echo "::error title=Сеть::в релизном манифесте нет android:networkSecurityConfig — WebView не откроет http://127.0.0.1, пустой экран"; exit 1; }
      - name: AAB (release, без подписи)
        run: flutter build appbundle --release
      - name: Вес — числом в отчёт
        run: |
          APK=$(du -k build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          AAB=$(du -k build/app/outputs/bundle/release/app-release.aab | cut -f1)
          {
            echo "## Вес сборки пилота"
            echo ""
            echo "| Что | Пилот на Flutter | Нынешняя версия (v2.54.22) |"
            echo "|---|---|---|"
            echo "| APK | $((APK / 1024)) МБ | 205 МБ |"
            echo "| AAB | $((AAB / 1024)) МБ | 195 МБ |"
            echo ""
            echo "⚠️ В пилоте три игры и нет ни картинок, ни звуков, ни питомца — прямое сравнение неверно."
            echo "Честное — после переноса целого хаба."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-pilot-android
          path: |
            flutter/build/app/outputs/flutter-apk/app-release.apk
            flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
