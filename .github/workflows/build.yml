name: Build native bundles (macOS + Windows + Android + Linux + iOS)

on:
  push:
    branches: [main]
    tags:    ['v*']
    # paths-ignore убран (аудит): раньше '.github/**' → правки самого CI не
    # проверялись этим workflow. Теперь любое изменение, включая CI, валидируется.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Cargo network hardening — крейты с crates.io иногда падают на
  # "curl [16] HTTP2 framing layer" (флейки HTTP/2). Отключаем мультиплексинг
  # (→ HTTP/1.1) + ретраи. Глобально: macOS/Windows/Android все дёргают cargo.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NODE_VERSION: '22'
  RUST_VERSION: 'stable'

jobs:
  # ─── TypeScript gate ──────────────────────────────────────────────────
  # Падает при любой ошибке tsc → блокирует web-deploy и release (ничего не публикуется).
  typecheck:
    name: TypeScript (tsc --noEmit)
    runs-on: ubuntu-latest
    # ⚠️ 20, А НЕ 10. 26.08.2026 выпуск v1.237.0 упал не на красной проверке, а по
    # ЛИМИТУ: шаг «Unit tests» убили на 10:14, и в логе нет ни строки итога — только
    # «Terminate orphan process (npm test --ci)». За день набор вырос с 207 до 368 с
    # локально (пять новых гейтов: единственность геометрических вариантов, ось
    # сэндвича, достижимость ступени, общее ядро «Паузы», словесный запас), а runner
    # медленнее этого Mac. Резать проверки ради лимита — ровно тот обмен, которого
    # делать нельзя: они и стоят столько, потому что гоняют генератор, а не читают файлы.
    timeout-minutes: 20
    steps:
      # ⚠️ ГЛУБИНА НУЖНА ГЕЙТУ ОБРАТНОГО КОНТУРА. Он собирает id репортов из
      # СООБЩЕНИЙ КОММИТОВ релиза (там связь и живёт: коммит 850e5606 дословно
      # называет отчёт, по которому сделан) и спрашивает базу, все ли помечены.
      # При клоне по умолчанию (depth 1) истории нет вовсе, и эта половина гейта
      # молча пропускалась бы КАЖДЫЙ раз — то есть не работала бы никогда.
      #
      # Сотня, а не вся история: .git репозитория 491 МБ, полный клон стоит
      # минуты. Тегов при этом нет, и гейт честно уходит на запасной путь
      # «последние сто коммитов» — помеченный репорт проходит проверку всегда,
      # поэтому лишний захват старых коммитов ничему не вредит.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 100

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Typecheck (gate)
        working-directory: frontend
        run: npx tsc --noEmit

      # v1.110.0: unit-тесты чистых функций (tokens/comboBonus/SRS/daily-challenge).
      # Падение теста блокирует web-deploy и release так же, как tsc.
      #
      # v1.205.0: сюда же попадают гейты дисциплины по исходникам — они читают
      # app/games/*.tsx текстом и потому идут в общем прогоне, отдельного шага не
      # просят. Что именно стерегут (жать искать по имени упавшего теста):
      #   game-clock-discipline   — Date.now() в замере длительности партии:
      #                             при паузе часы тикали дальше, «пока я писала
      #                             отзыв, игра закончилась»;
      #   ci-i18n-hardcode-guard  — language === 'ru' ? 'текст' : 'text' в экранах
      #                             игр: языков 12, а такой тернарник знает два,
      #                             остальным десяти достаётся английский, и
      #                             сличение словарей этого не видит в принципе.
      # SAMURAI_FULL=1 добирает уровни 8 и 12 — единственные, где самурай строится
      # на голых парах. Без флага набор берёт 1/3/5, и верхняя ступень сложности не
      # проверялась НИ РАЗУ ни на одной сборке. Довод «дорого» относился к прогону
      # всех двенадцати уровней (197 с); замер 19.08.2026 на этом файле: 9.3 с без
      # флага, 15.6 с с флагом. Шесть секунд.
      - name: Unit tests (gate)
        working-directory: frontend
        env:
          SAMURAI_FULL: '1'
        run: npm test -- --ci

      # v1.187.0: гейт судоку по требованию Дениса 07.08 — «чтобы он при каждой сборке
      # проверял все уровни». Для КАЖДОГО уровня 1..52 генерируется доска и проверяется:
      # решение существует, открытые клетки совпадают с решением, и решение ЕДИНСТВЕННО.
      # Последнее Валя ловила не раз: «игра имеет несколько вариантов победы», «произошла
      # ошибка, а могло быть оба варианта» — там честный ход засчитывался как промах.
      # ~210 с: 52 доски плюс перебор там, где логики не хватило. Поэтому отдельным шагом,
      # а не в общем наборе (тот идёт 6 с и должен оставаться быстрым локально).
      - name: Судоку — все уровни решаемы и решение единственно
        working-directory: frontend
        run: npm run test:levels

      # 🔴 ДИСЦИПЛИНА ПРОВЕРОК. Два класса проходят мимо зелёной сборки, и оба
      # выглядят как «всё хорошо»: забытый `it.only` выключает ВЕСЬ остальной файл
      # (jest прогонит одну проверку из тридцати и напишет PASS), а сломанная
      # настройка даёт «0 упавших» просто потому, что запускать было нечего.
      # Скрипт статический — он работает и до прогона, и стоит доли секунды.
      - name: Дисциплина проверок (нет .only/.skip, набор не съёжился)
        working-directory: frontend
        run: node scripts/test-discipline-gate.mjs

      # v1.161.0: гейт доступности. Ловит кнопку без подписи для скринридера
      # (VoiceOver/TalkBack) — иначе такое всплывает только на ревью в Apple.
      - name: a11y gate (кнопки без подписи)
        working-directory: frontend
        run: node scripts/a11y-audit.mjs

      # v1.166.0: обратный контур фидбека держится на ручном шаге — пометить
      # репорт при починке. Шаг забывается молча, и блок «Починили по твоим
      # репортам» останется пустым: человек снова ничего не узнает, а мы будем
      # думать, что узнал. Гейт валит релиз, если changelog говорит о репортах,
      # а в базе под эту версию не помечено ничего.
      - name: Обратный контур — репорты размечены
        run: node scripts/feedback-loop-gate.mjs

      # Направление «больше/меньше лучше» и границы правдоподобия записаны дважды:
      # LEADERBOARD_GAMES в frontend/src/services/leaderboard.ts и ветки RPC
      # psygames_submit_score в Supabase, откуда берётся rank_score. У «Маршрута» и
      # «Выбора из двух» меньше — лучше, у остальных наоборот, так что путать есть что.
      # Перевёрнутое в одном месте направление ставит первым ХУДШИЙ результат, и tsc с
      # jest этого не видят в принципе: тесты в базу не ходят, число на месте, знак не
      # тот. Гейт читает ЖИВЫЕ ветки функции (RPC psygames_leaderboard_rules, публикуемый
      # ключ, ничего не записывает) и сверяет с кодом поигрово.
      - name: Таблица рекордов — направление и границы совпадают с базой
        run: node scripts/leaderboard-rules-gate.mjs

      # v1.206.2: карточка обновления читается ТЕМ ЖЕ кодом, которым её потом
      # читает выкладка. Дважды подряд 19.08.2026 релиз доходил до последнего
      # шага и падал на ней: сначала записи под версию не было, потом она была,
      # но её строки стояли в двойных кавычках, а разбор понимал только
      # одинарные — и наружу шло «нет записи». Цена ошибки на последнем шаге —
      # полный круг: новый тег, новая версия, полчаса сборок под все платформы.
      - name: Карточка обновления для магазина читается
        run: node scripts/release-notes-gate.mjs

  # ─── Гейты на ЖИВОЙ веб-сборке ───────────────────────────────────────
  # v1.205.0 (19.08.2026). Две проверки, которые в jest не живут в принципе:
  # там нет вёрстки, а обе ловят именно нарисованный размер.
  #
  # 🔴 ЗАЧЕМ ОТДЕЛЬНАЯ ДЖОБА. Оба скрипта уже лежали в scripts/, но их НИКТО НЕ
  # ЗАПУСКАЛ: чинили руками, проверяли руками, и следующая правка тихо возвращала
  # беду. first-paint-audit написан 19.08 по находке «тропинка уровней невидима на
  # 62 экранах из 64» — держалось до поворота экрана, то есть у большинства
  # навсегда. tap-target-audit до 19.08 ходил только по маршрутам и НИ РАЗУ не
  # видел игрового поля: он упирался в экран настройки и отчитывался «чисто».
  #
  # Идёт на main и на тегах, блокирует release (см. needs у release). На main —
  # потому что регрессии вёрстки приезжают с обычными правками UI, а не с релизом.
  # Сборка нужна одна на обе проверки, поэтому они в одной джобе.
  web-gates:
    name: Веб-гейты (первый кадр + размер кнопок на поле)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # baseUrl="/psygames-web" нужен GH Pages, но локальному serve он ломает пути.
      # Правим на время экспорта и возвращаем назад, чтобы рабочее дерево не поехало.
      # На Linux `sed -i` без пустого аргумента (в отличие от macOS).
      - name: Build web (baseUrl="")
        working-directory: frontend
        run: |
          cp app.json app.json.bak
          sed -i 's|"baseUrl": "/psygames-web"|"baseUrl": ""|' app.json
          npx expo export -p web
          mv app.json.bak app.json

      # ⚠️ БРАУЗЕР КЛАДЁМ В КЕШ И СТАВИМ С ТАЙМАУТОМ. 19.08.2026 этот шаг завис
      # ДВАЖДЫ подряд: 33 минуты в веб-гейтах и 20 минут в smoke, где выел весь
      # лимит джобы и увёл релиз в «cancelled» — сборки под все платформы были
      # готовы, а выкладка не состоялась. Виснет системная часть (`--with-deps`
      # тянет apt), поэтому она отделена, ограничена по времени и не валит шаг:
      # на ubuntu-latest библиотеки для chromium и так на месте, а без кеша
      # скачивание браузера повторяется на каждой сборке впустую.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - name: Install Playwright chromium
        working-directory: frontend
        run: |
          npm i -D playwright --legacy-peer-deps
          timeout 300 npx playwright install-deps chromium || echo "системные библиотеки не доставились — идём дальше, на ubuntu-latest они есть"
          timeout 420 npx playwright install chromium

      - name: Поднять сборку
        working-directory: frontend
        run: |
          # ⚠️ НЕ `npx serve`: его cleanUrls редиректит `/warmup/index.html` в
          # `/warmup`, и относительные пути встроенной страницы «Зарядки» бьют
          # мимо корня (404 на styles.css/app.mjs). Свой сервер отдаёт и чистые
          # маршруты, и точные файлы без редиректов.
          node scripts/serve-dist.mjs dist 8127 >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8127 >/dev/null 2>&1 && break; sleep 2; done
          curl -sf -o /dev/null http://127.0.0.1:8127 || { echo "сборка не поднялась"; cat /tmp/serve.log; exit 1; }

      # Ловит вёрстку, схлопнувшуюся на первом кадре: useWindowDimensions отдаёт 0,
      # обновляется только по resize, которого при обычной загрузке не бывает —
      # ноль запекается в maxWidth, подпись встаёт по букве в столбик.
      - name: Первый кадр — ничего не схлопнулось
        working-directory: frontend
        run: node scripts/first-paint-audit.mjs http://127.0.0.1:8127

      # Заходит В ИГРУ (жмёт «Начать»/«Start»/«Уровень N — играть») и меряет то,
      # по чему стучат всю партию. Известные нарушители перечислены поимённо в
      # самом скрипте (ROUTE_DEBT/FIELD_DEBT) с обоснованием; долг может только
      # уменьшаться, новое — красное.
      # Три прохода: по маршрутам (44), на поле (48) и ШАПКА НА УЗКОМ ЭКРАНЕ (360 px).
      # Третий добавлен 02.09.2026 по двум отчётам об одном дефекте — «поехали
      # кнопки верх тулбара» и «с меню пиздец сверху»: размер элементов был
      # правильный, не хватало МЕСТА, и оба прежних прохода этого не видели.
      - name: Размер кнопок — на экранах и НА ПОЛЕ, шапка на узком экране
        working-directory: frontend
        run: node scripts/tap-target-audit.mjs --base=http://127.0.0.1:8127

      # Живой аудит слотов каркаса: низ экрана означает ОТВЕТ игрока, служебные
      # действия (отмена/подсказка/перемешать) — в шапке. Проверяет НАРИСОВАННОЕ
      # положение кнопок, а не исходник: в jest этого не увидеть.
      #
      # ⚠️ ТОЛЬКО НА ТЕГАХ. Заход по 69 играм со входом в партию идёт ~22 минуты;
      # вешать это на каждый push в main значит утроить время сборки. Долг
      # (eye-gym и PRL со «СТОП» внизу) записан в самом скрипте и печатается
      # отдельно, новое нарушение — красное.
      #
      # ⚠️ Сборка выше собрана с baseUrl="" — с боевым `/psygames-web` шрифты и
      # ассеты дают 404, кнопка «Играть» не срабатывает, и аудит честно скажет
      # «якорей нет», хотя код цел. Проверено 19.08.2026 своей же ошибкой.
      - name: Слоты каркаса — низ означает ответ игрока
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: frontend
        run: node scripts/slot-audit.mjs --base=http://127.0.0.1:8127

  # ─── Линт — храповиком, а не «всё или ничего» ────────────────────────
  # 🔴 23.08.2026: скрипт `lint` лежал в package.json с самого начала, и НИ ОДИН
  # workflow его не звал — линта в сборке не было вообще (задача 0940eb0a, п.3).
  # Замер на чистом дереве: 597 ошибок, 416 предупреждений. Блокирующий шаг
  # положил бы каждую сборку в тот же день, и его сняли бы к вечеру. Поэтому
  # храповик: краснеет, если долг ВЫРОС, и краснеет же, если долг заметно упал,
  # а потолок не опустили. Разбор — в шапке самого скрипта.
  lint:
    name: Линт (долг не растёт)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Долг линта не вырос
        working-directory: frontend
        run: node scripts/lint-ratchet.mjs

  # ─── Smoke games — ловит mount-краши/ошибки консоли ──────────────────
  # v1.110.0: БЛОКИРУЕТ release (по клику Дениса в аудите 2026-07-04).
  #
  # 🔴 23.08.2026 СНЯТ ТЕГ-ГЕЙТ. Была строка `if: startsWith(github.ref,
  # 'refs/tags/v')` — smoke шёл только на релизах. А веб уезжает пользователям
  # с main (`web-deploy` ниже), и до сегодняшнего дня он уезжал, пройдя ровно
  # `tsc` и `jest`: НИ ОДНА проверка, которая открывает игры, до выкладки не
  # доходила. Тег-гейт экономил минуты на том единственном прогоне, ради
  # которого всё и заведено.
  smoke:
    name: Smoke games (main + tags)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build web (baseUrl="")
        working-directory: frontend
        run: |
          cp app.json app.json.bak
          sed -i 's|"baseUrl": "/psygames-web"|"baseUrl": ""|' app.json
          npx expo export -p web
          mv app.json.bak app.json
      # ⚠️ БРАУЗЕР КЛАДЁМ В КЕШ И СТАВИМ С ТАЙМАУТОМ. 19.08.2026 этот шаг завис
      # ДВАЖДЫ подряд: 33 минуты в веб-гейтах и 20 минут в smoke, где выел весь
      # лимит джобы и увёл релиз в «cancelled» — сборки под все платформы были
      # готовы, а выкладка не состоялась. Виснет системная часть (`--with-deps`
      # тянет apt), поэтому она отделена, ограничена по времени и не валит шаг:
      # на ubuntu-latest библиотеки для chromium и так на месте, а без кеша
      # скачивание браузера повторяется на каждой сборке впустую.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - name: Install Playwright chromium
        working-directory: frontend
        run: |
          npm i -D playwright --legacy-peer-deps
          timeout 300 npx playwright install-deps chromium || echo "системные библиотеки не доставились — идём дальше, на ubuntu-latest они есть"
          timeout 420 npx playwright install chromium
      - name: Serve dist + run smoke
        working-directory: frontend
        run: |
          # ⚠️ НЕ `npx serve` — см. веб-гейты: редирект cleanUrls ломает встроенную «Зарядку».
          node scripts/serve-dist.mjs dist 8081 >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8081 >/dev/null 2>&1 && break; sleep 2; done
          # 🔴 START=1 ОБЯЗАТЕЛЕН. Без него скрипт открывает роут, ждёт 1,6 с и
          # собирает консоль — кнопку «Начать» он не нажимает НИ РАЗУ, то есть
          # «страница открылась» выдавалось за «в игру можно играть». История
          # этого класса: у goods-sort 19.08 встал гейт решаемости, а 22.08
          # нашлись 57 непроходимых уровней из 200 — гейт был зелёным, потому
          # что не исполнял код игры.
          BASE=http://localhost:8081 GAMES_DIR=./app/games START=1 node scripts/smoke-games.mjs

  # ─── macOS Apple Silicon ──────────────────────────────────────────────
  macos-arm:
    name: macOS arm64 (.app)
    # v1.156 (аудит): натив собираем ТОЛЬКО на тегах-релизах (и вручную) — раньше
    # пуш main+тег вместе давал ДВА прогона с двойной нативной сборкой. main-пуш
    # теперь = tsc + web-deploy (быстро), тег = натив + release + play.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest  # github-hosted M-runner, native arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-arm-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked --force

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build web for Tauri (baseUrl="")
        working-directory: frontend
        run: |
          cp app.json app.json.bak
          sed -i '' 's|"baseUrl": "/psygames-web"|"baseUrl": ""|' app.json
          npx expo export -p web
          mv app.json.bak app.json

      - name: Move dist into src-tauri
        run: |
          rm -rf src-tauri/dist
          mv frontend/dist src-tauri/dist

      - name: Clean stale bundle (mac, cached target)
        working-directory: src-tauri
        run: rm -rf target/aarch64-apple-darwin/release/bundle

      - name: Build .app (arm64)
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Package .app → tar.gz
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          tar -czf PsyGames-macos-arm64.tar.gz PsyGames.app
          ls -la PsyGames-macos-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/PsyGames-macos-arm64.tar.gz
          retention-days: 30

      # v1.17.0: Tauri updater artifacts (подписанный .app.tar.gz + .sig)
      - name: Upload macOS updater artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-macos-updater
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/PsyGames.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/PsyGames.app.tar.gz.sig
          retention-days: 30
        continue-on-error: true

  # ─── iOS (симулятор, без подписи) ──────────────────────────────────────
  # Решение Дениса 02.09.2026: «переходи к сборке для айфона… делай на все
  # платформы сразу».
  #
  # ⚠️ ЧТО ЭТА СБОРКА ЕСТЬ И ЧЕГО В НЕЙ НЕТ. Подписанная сборка для устройства и
  # App Store требует Apple Developer Program ($99/год) и трёх секретов, которых
  # в репозитории пока нет: сертификата, provisioning profile и ключа App Store
  # Connect (Issuer ID + Key ID + .p8). Порядок получения обратный расхожему
  # страху: ключи выдаются СРАЗУ после регистрации аккаунта, проверка приложения
  # бывает только при загрузке сборки в TestFlight.
  #
  # До появления ключей собираем под СИМУЛЯТОР без подписи. Это отвечает на
  # единственный вопрос, на который можно ответить сейчас: собирается ли
  # приложение под iOS вообще. Артефакт ставится в симулятор Xcode, в App Store
  # не годится.
  ios-sim:
    name: iOS (симулятор, без подписи)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    # ⚠️ Не роняет выпуск: пока нет ключей, эта сборка — разведка, а не поставка.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked --force

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build web for Tauri (baseUrl="")
        working-directory: frontend
        run: |
          cp app.json app.json.bak
          sed -i '' 's|"baseUrl": "/psygames-web"|"baseUrl": ""|' app.json
          npx expo export -p web
          mv app.json.bak app.json

      - name: Move dist into src-tauri
        run: |
          rm -rf src-tauri/dist
          mv frontend/dist src-tauri/dist

      - name: Initialize Tauri iOS project
        working-directory: src-tauri
        run: cargo tauri ios init

      - name: Build for simulator (unsigned)
        working-directory: src-tauri
        run: cargo tauri ios build --target aarch64-sim --debug

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-ios-simulator
          path: src-tauri/gen/apple/build/**/*.app
          retention-days: 14
        continue-on-error: true

  # ─── iOS: подписанная сборка и TestFlight ──────────────────────────────
  # 🔴 ПОДПИСЬ ЧЕРЕЗ КЛЮЧ App Store Connect API, А НЕ ЧЕРЕЗ .p12.
  #
  # Классический путь (сертификат распространения в base64 + пароль + связка ключей)
  # требует, чтобы кто-то раз в год экспортировал .p12 из Keychain и не перепутал тип
  # сертификата. Ключ API решает то же самое одним файлом: `-allowProvisioningUpdates`
  # заставляет Xcode САМ создать сертификат и профиль под этим ключом.
  #
  # Проверено локально 02.09.2026: без ключа xcodebuild отвечает «No Accounts: Add a
  # new account in Accounts settings» — то есть путь без него на чистой машине не
  # работает вовсе, а именно чистой машиной раннер и является.
  #
  # Секреты: APPLE_API_KEY (.p8 целиком), APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_TEAM_ID.
  ios-release:
    name: iOS (подписанная сборка → TestFlight)
    # 🔴 РУЧНОЙ ЗАПУСК БЕЗ ВЫКЛАДКИ. До 02.09.2026 джоба шла ТОЛЬКО по тегу,
    # и каждая проверка конвейера сжигала версию: три подряд неудачи — три патч-тега
    # с пустыми изменениями. Теперь её можно запустить руками (workflow_dispatch) и
    # увидеть, собирается ли .ipa; шаг выгрузки при этом пропускается — публикует
    # по-прежнему только тег.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Есть ли ключ Apple
        id: keys
        run: |
          if [ -n "${{ secrets.APPLE_API_KEY }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS::Ключа Apple нет — подписанная сборка пропущена."
          fi

      - name: Setup Node
        if: steps.keys.outputs.ready == 'yes'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust + iOS target
        if: steps.keys.outputs.ready == 'yes'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Tauri CLI + CocoaPods
        if: steps.keys.outputs.ready == 'yes'
        run: |
          cargo install tauri-cli --version "^2.0" --locked --force
          brew install cocoapods

      - name: Install frontend deps
        if: steps.keys.outputs.ready == 'yes'
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build web for Tauri (baseUrl="")
        if: steps.keys.outputs.ready == 'yes'
        working-directory: frontend
        run: |
          cp app.json app.json.bak
          sed -i '' 's|"baseUrl": "/psygames-web"|"baseUrl": ""|' app.json
          npx expo export -p web
          mv app.json.bak app.json

      - name: Move dist into src-tauri
        if: steps.keys.outputs.ready == 'yes'
        run: |
          rm -rf src-tauri/dist
          mv frontend/dist src-tauri/dist

      # Ключ кладём туда, где его ищет xcodebuild, и стираем в конце job при любом исходе.
      - name: Разложить ключ API
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Init iOS project
        if: steps.keys.outputs.ready == 'yes'
        working-directory: src-tauri
        run: cargo tauri ios init

      # 🔴 ПАТЧ ПРОЕКТА ОБЯЗАТЕЛЕН И ИМЕННО ЗДЕСЬ: `gen/` лежит в .gitignore и
      # генерируется заново каждой сборкой, поэтому правки живут только так.
      # Что чинится и почему — в шапке самого скрипта; всё проверено живьём
      # 02.09.2026 по пути до успешной валидации Apple.
      - name: Патч проекта (подпись, линковка, iOS 15)
        if: steps.keys.outputs.ready == 'yes'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install xcodegen
          python3 scripts/ios-project-patch.py --team "$TEAM" --profile "PsyGames App Store"

      # Сертификат распространения и профиль App Store — через API. Автоподпись
      # Xcode тут не работает: она делает DEVELOPMENT-профиль, которому нужны
      # зарегистрированные устройства («Your team has no devices…»).
      - name: Сертификат и профиль
        if: steps.keys.outputs.ready == 'yes'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: bash scripts/ios-signing-setup.sh

      # 🔴 СОБИРАЕТ TAURI, А НЕ ГОЛЫЙ XCODEBUILD — И ЭТО НЕ ВКУСОВЩИНА.
      #
      # Здесь стоял прямой `xcodebuild archive`. Он не может работать НИКОГДА:
      # фаза «Build Rust Code» внутри проекта зовёт `cargo tauri ios xcode-script`,
      # а тот безусловно идёт за настройками к веб-сокет-серверу, который поднимает
      # сам `cargo tauri ios build`. Без него скрипт падает:
      #   panicked at tauri-cli/src/mobile/mod.rs:386
      #   failed to read missing addr file …com.odv999.psygames-server-addr
      # Сверено по исходнику двух версий CLI (2.11.2 и 2.11.4) — вызов `read_options`
      # стоит в `xcode_script.rs` без всяких условий, то есть от профиля не зависит.
      #
      # ⚠️ ПОЧЕМУ ЭТО ПРОШЛО ЖИВОЙ ПРОГОН 02.09 И ВСЁ РАВНО БЫЛО СЛОМАНО. На маке
      # я перед этим собирал через `cargo tauri ios build`, сервер поднимался, файл
      # адреса оставался в /tmp — и следующий ручной `xcodebuild` находил готовое.
      # То есть «проверено живьём» покрыло путь, которого в чистой машине нет.
      # Урок ровно тот же, что с сертификатом днём раньше: зелёный прогон на СВОЕЙ
      # машине не доказывает работоспособность на чистой.
      #
      # `--export-method app-store-connect` заставляет tauri собрать и экспортировать
      # .ipa для App Store своими руками; подпись и профиль берутся из проекта, куда
      # их кладёт `ios-project-patch.py`.
      - name: Сборка .ipa (tauri ведёт xcodebuild сам)
        if: steps.keys.outputs.ready == 'yes'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          CI: 'true'
        run: cargo tauri ios build --export-method app-store-connect

      - name: Upload to TestFlight
        if: steps.keys.outputs.ready == 'yes' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # tauri кладёт .ipa под src-tauri/gen/apple/build/<арх>/; ищем по всему
          # дереву сборки, чтобы не зависеть от имени архитектуры.
          IPA=$(find src-tauri/gen/apple/build "$RUNNER_TEMP" -name '*.ipa' 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "::error title=iOS::.ipa не найден"; exit 1; fi
          # ⚠️ Сначала ВАЛИДАЦИЯ. Она ловит структурные ошибки бандла (код 90171 —
          # «Invalid bundle structure», на нём мы стояли трижды 02.09.2026) до того,
          # как сборка займёт очередь обработки у Apple: отказ после загрузки виден
          # только через письмо и полчаса ожидания.
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Стереть ключ
        if: always() && steps.keys.outputs.ready == 'yes'
        run: rm -rf ~/private_keys

      - name: Upload artifact
        if: steps.keys.outputs.ready == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-ios-ipa
          # Путь изменился вместе со способом сборки: .ipa кладёт tauri в дерево
          # проекта, а не xcodebuild в RUNNER_TEMP.
          path: src-tauri/gen/apple/build/**/*.ipa
          retention-days: 14
        continue-on-error: true

  # ─── Linux x86_64 ──────────────────────────────────────────────────────
  # Решение Дениса 02.09.2026: «с этого момента делать на все платформы сразу —
  # андроид, айфон, мак, вин, линукс». Linux добавлен первым из двух: он не
  # требует ни сертификатов, ни платного аккаунта — только системных библиотек
  # WebKit, которые ставятся в самом job.
  linux-x64:
    name: Linux x86_64 (.AppImage + .deb)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ⚠️ 22.04, а не 24.04: Tauri 2 на Linux собирается против webkit2gtk-4.1,
      # которого в 24.04 нет под тем же именем пакета. Смена раннера на новее
      # ломает сборку молча — на этапе линковки, а не на установке.
      - name: System deps (WebKit + GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Cache Cargo target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked --force

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build web for Tauri (baseUrl="")
        working-directory: frontend
        run: |
          cp app.json app.json.bak
          sed -i 's|"baseUrl": "/psygames-web"|"baseUrl": ""|' app.json
          npx expo export -p web
          mv app.json.bak app.json

      - name: Move dist into src-tauri
        run: |
          rm -rf src-tauri/dist
          mv frontend/dist src-tauri/dist

      - name: Build bundles
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  # ─── Windows x86_64 ────────────────────────────────────────────────────
  windows-x64:
    name: Windows x86_64 (.exe)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-win-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked --force

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build web for Tauri (baseUrl="")
        working-directory: frontend
        shell: bash
        run: |
          cp app.json app.json.bak
          sed -i 's|"baseUrl": "/psygames-web"|"baseUrl": ""|' app.json
          npx expo export -p web
          mv app.json.bak app.json

      - name: Move dist into src-tauri
        shell: bash
        run: |
          rm -rf src-tauri/dist
          mv frontend/dist src-tauri/dist

      - name: Clean stale bundle (win, cached target)
        working-directory: src-tauri
        shell: bash
        run: rm -rf target/x86_64-pc-windows-msvc/release/bundle

      - name: Build .exe + .msi
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-windows-x64-exe
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-windows-x64-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 30
        continue-on-error: true

      # v1.17.0: Tauri updater signature для NSIS -setup.exe
      - name: Upload Windows updater .sig
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-windows-updater-sig
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          retention-days: 30
        continue-on-error: true

  # ─── Android (signed APK + AAB) ───────────────────────────────────────
  android:
    name: Android (signed .apk + .aab)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked --force

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build web for Tauri (baseUrl="")
        working-directory: frontend
        run: |
          cp app.json app.json.bak
          sed -i 's|"baseUrl": "/psygames-web"|"baseUrl": ""|' app.json
          npx expo export -p web
          mv app.json.bak app.json

      - name: Move dist into src-tauri
        run: |
          rm -rf src-tauri/dist
          mv frontend/dist src-tauri/dist

      - name: Decode signing keystore
        run: |
          mkdir -p src-tauri/keys
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/keys/psygames-release.jks
          ls -la src-tauri/keys/

      - name: Initialize Tauri Android project
        working-directory: src-tauri
        run: cargo tauri android init

      - name: Respect system auto-rotate (Android manifest) — fullUser
        working-directory: src-tauri
        run: |
          # ЗАЧЕМ fullUser, а НЕ sensor.
          # `sensor` крутит активити по датчику ДАЖЕ КОГДА пользователь выключил
          # автоповорот в настройках телефона — приложение переворачивалось само
          # вопреки системной настройке (репорт тестировщика: «экран переворачивается
          # сам, автоповорот отключён»), а потом OrientationGuard ещё и требовал
          # повернуть обратно. Замкнутый круг раздражения.
          # `fullUser` = поворот отдан системе: автоповорот ВЫКЛ → активити не крутится
          # вообще; автоповорот ВКЛ → доступны все ориентации, значит landscape-раскладка
          # судоку (сетка слева, цифры справа) по-прежнему достижима.
          MANIFEST=gen/android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:screenOrientation="fullUser"#' "$MANIFEST"
            # v1.170: права на микрофон. Голосовая заметка в отзыве (v1.166) уехала в
            # прод МЁРТВОЙ — репорт дословно: «почему микрофон не работает»,
            # «микрофон недоступен». В браузере разрешение выдаёт сам браузер, поэтому
            # при проверке всё работало.
            #
            # ВАЖНО, ЧТО ИМЕННО СЛОМАНО. Обработчик onPermissionRequest у WebView УЖЕ
            # ЕСТЬ — его делает сам wry (RustWebChromeClient.kt): на AUDIO_CAPTURE он
            # запрашивает у системы RECORD_AUDIO + MODIFY_AUDIO_SETTINGS и по успеху
            # зовёт request.grant(). Но если права не объявлены в манифесте, системный
            # запрос возвращает «отказано» мгновенно, и wry честно делает request.deny().
            # То есть код был рабочий, не хватало ровно двух строк объявления.
            #
            # VIBRATE — та же болезнь, вскрыта 12.08.2026 расшифровкой голосового
            # репорта: «вибрация — настройку включила, но её не было». Запись месяц
            # пролежала неразобранной. Проводка в приложении цела: переключатель →
            # флаг → navigator.vibrate. Но в Android-вебвью vibrate() без объявленного
            # разрешения молча возвращает false — ни ошибки, ни вибрации. В браузере
            # при проверке всё работало, потому что там разрешение не нужно.
            for P in RECORD_AUDIO MODIFY_AUDIO_SETTINGS VIBRATE; do
              grep -q "android.permission.$P" "$MANIFEST" || \
                sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" "$MANIFEST"
            done
            echo "— rotation + аудио-права + вибрация applied —"
            grep -n "screenOrientation\|RECORD_AUDIO\|MODIFY_AUDIO\|VIBRATE\|MainActivity" "$MANIFEST" || true
          else
            echo "WARN: $MANIFEST не найден — пропускаю (OrientationGuard в webview покрывает)"; find gen/android -name AndroidManifest.xml -type f || true
          fi

      - name: Safe-area — инсеты системных панелей (MainActivity)
        working-directory: src-tauri
        run: |
          # ЗАЧЕМ. targetSdk 35+ рисует приложение ОТ КРАЯ ДО КРАЯ: системные панели
          # лежат поверх контента. Chromium-WebView отдаёт в env(safe-area-inset-*)
          # только ВЫРЕЗ экрана — ни статус-бар, ни навигацию он туда не кладёт.
          # Отсюда две разные проблемы и два разных решения:
          #
          #  НИЗ  — паддинг нативно. Навигация перекрывала кнопки игр (репорт Вали
          #         «кнопка "играть" не видна на Самсунге»). setPadding сжимает
          #         WebView; в освободившейся полосе виден фон окна, но снизу это
          #         незаметно.
          #  ВЕРХ и БОКА — значения отдаём в JS (window.__psyInsets), паддинг ставит
          #         само приложение. Нативным паддингом нельзя: под статус-баром
          #         показался бы фон ОКНА, а он один, тогда как у приложения две темы
          #         (#F5F5F7 и #000000) — в одной из них вылезла бы чужая полоса.
          #         Телефон БЕЗ выреза давал env(top)=0 и шапку под системными
          #         иконками — это и есть предупреждение Google Play «отображение от
          #         края до края может работать не у всех пользователей» (v1.157.0).
          #
          # Вариант «B» из ROADMAP — переживёт Android 16 (opt-out атрибут — нет).
          MAIN=$(find gen/android -name MainActivity.kt | head -1)
          if [ -z "$MAIN" ]; then echo "ERROR: MainActivity.kt not found"; exit 1; fi
          python3 - "$MAIN" <<'PYEOF'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          if 'setOnApplyWindowInsetsListener' in s:
              print('insets listener already present'); sys.exit(0)
          # Платформенный API (без androidx) — ноль внешних зависимостей.
          if 'import android.os.Bundle' not in s:
              s = re.sub(r'^(package [^\n]+\n)', r'\1\nimport android.os.Bundle\n', s, count=1)
          listener = (
              '\n    // PsyGames: инсеты системных панелей (edge-to-edge, targetSdk 35+)\n'
              '    window.decorView.setOnApplyWindowInsetsListener { _, insets ->\n'
              '      val sdk30 = android.os.Build.VERSION.SDK_INT >= 30\n'
              '      // Берём панели И вырез экрана: в альбомной ориентации чёлка уходит вбок\n'
              '      val bars = if (sdk30)\n'
              '          insets.getInsets(\n'
              '            android.view.WindowInsets.Type.systemBars() or android.view.WindowInsets.Type.displayCutout())\n'
              '        else null\n'
              '      val top = if (bars != null) bars.top else @Suppress("DEPRECATION") insets.systemWindowInsetTop\n'
              '      val bottom = if (bars != null) bars.bottom else @Suppress("DEPRECATION") insets.systemWindowInsetBottom\n'
              '      val left = if (bars != null) bars.left else @Suppress("DEPRECATION") insets.systemWindowInsetLeft\n'
              '      val right = if (bars != null) bars.right else @Suppress("DEPRECATION") insets.systemWindowInsetRight\n'
              '      // Клавиатуру здесь НЕ трогаем. Соблазн добавить отступ под IME\n'
              '      // велик, но layout под клавиатуру уже сжимает сам WebView: в\n'
              '      // app/+html.tsx стоит viewport interactive-widget=resizes-content\n'
              '      // (v1.123). Нативный отступ поверх этого компенсировал бы высоту\n'
              '      // клавиатуры дважды и подбрасывал содержимое вверх сильнее, чем нужно.\n'
              '      // Низ — нативным паддингом: кнопки игр не должны попадать под навигацию.\n'
              '      findViewById<android.view.View>(android.R.id.content)?.setPadding(0, 0, 0, bottom)\n'
              '      // Верх и бока — в JS. Инсеты в физических пикселях, WebView считает\n'
              '      // в CSS-пикселях, поэтому делим на density.\n'
              '      val d = resources.displayMetrics.density\n'
              '      publishInsets(top / d, left / d, right / d)\n'
              '      insets\n'
              '    }\n'
              # PsyGames: авто-обновление Google Play (flexible in-app update) —
              # проверяем при старте; скачивается в фоне, по готовности Play
              # сам предлагает перезапуститься. Всё в try/Throwable — не крашит.
              '    try {\n'
              '      val updMgr = com.google.android.play.core.appupdate.AppUpdateManagerFactory.create(this)\n'
              '      updMgr.appUpdateInfo.addOnSuccessListener { info ->\n'
              '        if (info.updateAvailability() == com.google.android.play.core.install.model.UpdateAvailability.UPDATE_AVAILABLE\n'
              '            && info.isUpdateTypeAllowed(com.google.android.play.core.install.model.AppUpdateType.FLEXIBLE)) {\n'
              '          updMgr.registerListener { state ->\n'
              '            if (state.installStatus() == com.google.android.play.core.install.model.InstallStatus.DOWNLOADED) {\n'
              '              updMgr.completeUpdate()\n'
              '            }\n'
              '          }\n'
              '          try {\n'
              '            updMgr.startUpdateFlowForResult(info, com.google.android.play.core.install.model.AppUpdateType.FLEXIBLE, this, 17563)\n'
              '          } catch (e: Exception) {}\n'
              '        }\n'
              '      }\n'
              '    } catch (e: Throwable) {}\n'
          )
          if 'super.onCreate(' in s:
              # onCreate уже есть (шаблон tauri) — вставляем ПОСЛЕ super.onCreate(...)
              s = re.sub(r'(super\.onCreate\([^\)]*\)\s*\n)', r'\1' + listener, s, count=1)
          else:
              method = (
                  '  override fun onCreate(savedInstanceState: Bundle?) {\n'
                  '    super.onCreate(savedInstanceState)\n'
                  + listener +
                  '  }\n'
              )
              if re.search(r'class MainActivity[^\{]*\{', s):
                  i = s.rfind('}')
                  s = s[:i] + method + s[i:]
              else:
                  s = re.sub(r'(class MainActivity[^\n]*)\n', r'\1 {\n' + method + '}\n', s, count=1)
          # Публикация инсетов в WebView. Tauri не даёт ссылку на WebView наружу,
          # поэтому ищем его обходом дерева view. evaluateJavascript кладёт значения
          # в window.__psyInsets и будит React-мост событием psy-insets. Мост берёт
          # максимум с env(), поэтому на телефоне с вырезом двойного отступа не будет.
          publisher = (
              '\n  private var lastInsets: String = ""\n'
              '\n  private fun findWebView(v: android.view.View?): android.webkit.WebView? {\n'
              '    if (v is android.webkit.WebView) return v\n'
              '    if (v is android.view.ViewGroup) {\n'
              '      for (i in 0 until v.childCount) {\n'
              '        val r = findWebView(v.getChildAt(i))\n'
              '        if (r != null) return r\n'
              '      }\n'
              '    }\n'
              '    return null\n'
              '  }\n'
              # Потолок системного масштаба шрифта.
              #
              # Android даёт увеличивать текст до 200%, WebView применяет это как
              # textZoom ко всему интерфейсу разом. На 175-200% подписи перестают
              # помещаться в кнопки («в увеличенном размере системного шрифта тексты
              # в кнопке плохо влазят» — репорт Rulon, v1.171). Полностью игнорировать
              # системный размер нельзя: для того он и есть, и человек с плохим
              # зрением останется ни с чем. Поэтому потолок 135%: крупнее штатного
              # заметно, а вёрстка ещё держит.
              '\n  private fun clampTextZoom() {\n'
              '    val wv = findWebView(findViewById(android.R.id.content)) ?: return\n'
              '    try { if (wv.settings.textZoom > 135) wv.settings.textZoom = 135 } catch (e: Throwable) {}\n'
              '  }\n'
              '\n  private fun publishInsets(top: Float, left: Float, right: Float) {\n'
              '    clampTextZoom()\n'
              '    val payload = "{top:" + top + ",bottom:0,left:" + left + ",right:" + right + "}"\n'
              '    if (payload == lastInsets) return\n'
              '    val wv = findWebView(findViewById(android.R.id.content)) ?: return\n'
              '    lastInsets = payload\n'
              '    try {\n'
              '      wv.evaluateJavascript(\n'
              '        "window.__psyInsets=" + payload + ";" +\n'
              "        \"window.dispatchEvent(new CustomEvent('psy-insets'));\", null)\n"
              '    } catch (e: Throwable) {}\n'
              '  }\n'
          )
          i = s.rfind('}')
          s = s[:i] + publisher + s[i:]
          if 'setOnApplyWindowInsetsListener' not in s or 'publishInsets' not in s:
              print('ERROR: patch failed to apply'); sys.exit(1)
          open(p, 'w').write(s)
          print('MainActivity patched: bottom padding + insets bridge to WebView')
          PYEOF
          echo '--- MainActivity.kt after patch ---'
          cat "$MAIN"

      - name: Микрофон — спросить разрешение у СИСТЕМЫ, а не только объявить
        working-directory: src-tauri
        run: |
          # 🔴 ЗАЧЕМ. Голосовые заметки приезжали немыми с 15 устройств из 16 —
          # цифровая тишина, пик −91 дБ, три недели подряд. Причину искали в записи
          # и не нашли: getUserMedia отдаёт поток, дорожка живая, muted=false,
          # MediaRecorder пишет валидный файл правильной длительности из нулей.
          #
          # Ответ дала диагностика, уехавшая в v1.211.0. Два боевых отчёта принесли
          # прямой ответ системы:  {"inputs": 3, "named": 0, "permission": "unsupported"}
          # Три микрофонных входа видны, и НИ ОДНОГО С ИМЕНЕМ. По спецификации имена
          # устройств пусты ровно до тех пор, пока у страницы нет действующего
          # разрешения на микрофон. Значит разрешения у приложения нет — при том, что
          # RECORD_AUDIO объявлен в манифесте с v1.170.
          #
          # ⚠️ ОБЪЯВИТЬ ≠ ПОЛУЧИТЬ. На Android 6+ опасное разрешение надо ещё
          # ЗАПРОСИТЬ во время работы, и никто этого не делал. Расчёт был на wry:
          # его WebChromeClient на AUDIO_CAPTURE сам просит RECORD_AUDIO. В бою этот
          # путь не сработал ни на одном устройстве, и спорить с фактом нечем.
          #
          # ⚠️ ПОЧЕМУ НЕ НА СТАРТЕ. Тренажёр памяти, спрашивающий микрофон при первом
          # запуске, выглядит как приложение, которое подслушивает. Спрашиваем в
          # момент, когда человек сам собрался записать голосом, — мост зовёт запрос
          # из окна отзыва. Пока не позвали, дело обстоит ровно как сегодня.
          #
          # ⚠️ ЧТО ОТКРЫВАЕТ МОСТ. Ровно два метода без аргументов: спросить состояние
          # и показать системный диалог. Ни файлов, ни данных, ни возврата чего-либо
          # чувствительного. WebView грузит только наши собственные ассеты.
          MAIN=$(find gen/android -name MainActivity.kt | head -1)
          if [ -z "$MAIN" ]; then echo "ERROR: MainActivity.kt not found"; exit 1; fi
          python3 - "$MAIN" <<'PYEOF'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          if 'psyStartRec' in s:
              print('mic bridge already present'); sys.exit(0)

          bridge = (
              '\n  // ── Микрофон: мост в WebView ────────────────────────────────\n'
              '  private fun psyMicGranted(): Boolean =\n'
              '    android.os.Build.VERSION.SDK_INT < 23 ||\n'
              '    checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) ==\n'
              '      android.content.pm.PackageManager.PERMISSION_GRANTED\n'
              '\n  private fun psyRequestMic() {\n'
              '    if (android.os.Build.VERSION.SDK_INT < 23 || psyMicGranted()) return\n'
              '    try { requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO), 4711) }\n'
              '    catch (e: Throwable) {}\n'
              '  }\n'
              '\n  // ── Нативная запись (задача 06790750): обход мёртвого стека записи\n'
              '  // устаревшего WebView (Chrome<100 пишет PCM-нули при живом getUserMedia).\n'
              '  // Пишет системный MediaRecorder в кэш, stopRec отдаёт файл base64\n'
              '  // (≤3 мин AAC 32 кбит/с ≈ 720 КБ — в пределах addJavascriptInterface).\n'
              '  private var psyRec: android.media.MediaRecorder? = null\n'
              '  private var psyRecPath: String? = null\n'
              '\n  private fun psyStartRec(): String {\n'
              '    if (!psyMicGranted()) return "denied"\n'
              '    try { psyRec?.release() } catch (e: Throwable) {}\n'
              '    psyRec = null\n'
              '    return try {\n'
              '      val f = java.io.File(cacheDir, "psy_voice.m4a")\n'
              '      val r = android.media.MediaRecorder()\n'
              '      r.setAudioSource(android.media.MediaRecorder.AudioSource.MIC)\n'
              '      r.setOutputFormat(android.media.MediaRecorder.OutputFormat.MPEG_4)\n'
              '      r.setAudioEncoder(android.media.MediaRecorder.AudioEncoder.AAC)\n'
              '      r.setAudioSamplingRate(16000)\n'
              '      r.setAudioChannels(1)\n'
              '      r.setAudioEncodingBitRate(32000)\n'
              '      r.setOutputFile(f.absolutePath)\n'
              '      r.prepare(); r.start()\n'
              '      psyRec = r; psyRecPath = f.absolutePath\n'
              '      "ok"\n'
              '    } catch (e: Throwable) { "error:" + (e.message ?: "start") }\n'
              '  }\n'
              '\n  private fun psyStopRec(): String {\n'
              '    val r = psyRec ?: return "error:not_recording"\n'
              '    psyRec = null\n'
              '    return try {\n'
              '      r.stop(); r.release()\n'
              '      val path = psyRecPath ?: return "error:no_file"\n'
              '      val f = java.io.File(path)\n'
              '      val bytes = f.readBytes()\n'
              '      try { f.delete() } catch (e: Throwable) {}\n'
              '      if (bytes.isEmpty()) "error:empty"\n'
              '      else android.util.Base64.encodeToString(bytes, android.util.Base64.NO_WRAP)\n'
              '    } catch (e: Throwable) {\n'
              '      try { r.release() } catch (t: Throwable) {}\n'
              '      "error:" + (e.message ?: "stop")\n'
              '    }\n'
              '  }\n'
              '\n  private fun psyCancelRec() {\n'
              '    val r = psyRec\n'
              '    psyRec = null\n'
              '    try { r?.stop() } catch (e: Throwable) {}\n'
              '    try { r?.release() } catch (e: Throwable) {}\n'
              '    try { psyRecPath?.let { java.io.File(it).delete() } } catch (e: Throwable) {}\n'
              '  }\n'
              '\n  inner class PsyNativeBridge {\n'
              '    @android.webkit.JavascriptInterface\n'
              '    fun micState(): String = if (psyMicGranted()) "granted" else "denied"\n'
              '    @android.webkit.JavascriptInterface\n'
              '    fun requestMic() { runOnUiThread { psyRequestMic() } }\n'
              '    @android.webkit.JavascriptInterface\n'
              '    fun startRec(): String = psyStartRec()\n'
              '    @android.webkit.JavascriptInterface\n'
              '    fun stopRec(): String = psyStopRec()\n'
              '    @android.webkit.JavascriptInterface\n'
              '    fun cancelRec() { psyCancelRec() }\n'
              '  }\n'
              '\n  private fun psyInstallMicBridge() {\n'
              '    val wv = findWebView(findViewById(android.R.id.content)) ?: return\n'
              '    try { wv.addJavascriptInterface(PsyNativeBridge(), "PsyNative") } catch (e: Throwable) {}\n'
              '  }\n'
          )
          i = s.rfind('}')
          s = s[:i] + bridge + s[i:]

          # Ставим мост тогда же, когда уже зовётся clampTextZoom: в этот момент
          # WebView в дереве уже есть, раньше его может не быть вовсе.
          #
          # ⚠️ ЯКОРЬ — ВЫЗОВ, А НЕ ОБЪЯВЛЕНИЕ. Первая редакция искала
          # `\n\s*clampTextZoom\(\)` и попадала в строку `private fun clampTextZoom() {`,
          # то есть в объявление. Хуже другое: проверка ниже искала подстроку
          # `psyInstallMicBridge()` — а она есть в ОБЪЯВЛЕНИИ моста, поэтому патч
          # рапортовал успех, оставив мост никогда не установленным. Поймано прогоном
          # патча на заготовке, а не чтением. Требуем перевод строки СРАЗУ после
          # скобок — у объявления там `{`.
          # ⚠️ СТАВИМ В ДВУХ МЕСТАХ, И ЭТО НЕ ПЕРЕСТРАХОВКА. `addJavascriptInterface`
          # действует со СЛЕДУЮЩЕЙ загрузки страницы: интерфейс, привязанный к уже
          # загруженной странице, в ней не появится. Инсеты публикуются после
          # раскладки, то есть заведомо после начала загрузки — поставленный только
          # там мост был бы невидим для живой страницы. Ровно это и вышло: v1.214.0
          # уехала, и первый же отчёт принёс прежнее `named: 0`.
          #
          # Поэтому РАННЯЯ привязка сразу после super.onCreate (WebView к этому
          # моменту уже создан родителем, страница ещё не загружена) плюс поздняя на
          # инсетах — на случай, если раннего WebView в дереве ещё нет. Повторная
          # привязка тем же именем безвредна: она заменяет предыдущую.
          points = 0
          sup = re.compile(r'\n(\s*)super\.onCreate\(savedInstanceState\)\n')
          if sup.search(s):
              s = sup.sub(lambda m: f'\n{m.group(1)}super.onCreate(savedInstanceState)\n{m.group(1)}psyInstallMicBridge()\n', s, count=1)
              points += 1
          call = re.compile(r'\n(\s*)clampTextZoom\(\)\n')
          if call.search(s):
              s = call.sub(lambda m: f'\n{m.group(1)}clampTextZoom()\n{m.group(1)}psyInstallMicBridge()\n', s, count=1)
              points += 1
          if points == 0:
              print('ERROR: некуда поставить мост — нет ни super.onCreate, ни вызова clampTextZoom'); sys.exit(1)
          print(f'мост привязан в {points} местах (ранняя привязка обязательна: интерфейс действует со следующей загрузки)')

          # Проверяем ВЫЗОВ (строка целиком), а не имя: имя есть и в объявлении.
          if not re.search(r'\n\s*psyInstallMicBridge\(\)\n', s) or 'PsyNativeBridge' not in s or 'psyStartRec' not in s:
              print('ERROR: mic bridge patch failed to apply'); sys.exit(1)
          open(p, 'w').write(s)
          print('MainActivity patched: mic permission bridge')
          PYEOF
          grep -n "psyRequestMic\|PsyNative\|psyInstallMicBridge" "$MAIN" || { echo "ERROR: bridge not found after patch"; exit 1; }

      - name: Patch build.gradle.kts with signing config
        working-directory: src-tauri
        run: |
          GRADLE=gen/android/app/build.gradle.kts
          if [ ! -f "$GRADLE" ]; then
            echo "ERROR: $GRADLE not found after android init"
            find gen/android -name "build.gradle*" -type f
            exit 1
          fi
          # Use absolute path from env var (avoids fragile relative resolution).
          cat >> "$GRADLE" <<'EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      // ⚠️ isShrinkResources ОТКЛЮЧЁН ОБРАТНО (v1.190.2).
                      // Включали по рекомендации Play «удаление неиспользуемых ресурсов не
                      // включено». Замер после сборки: APK стал 70 МБ против 69 у v1.189 —
                      // то есть не выиграли НИЧЕГО, — а гейт целостности показал «ПОТЕРЯНО:
                      // иконка». Два тег-прогона подряд упали, три дня без релиза: правки
                      // (немые голосовые, лицензия, истории) не доехали до тестировщика,
                      // и она всё это время сидела на v1.189.
                      // Рекомендация Play была косметической, релизы — нет. Возвращаться к
                      // ней стоит отдельно и с проверкой, что именно ужимается.
                  }
              }
          }

          dependencies {
              implementation("com.google.android.play:app-update:2.1.0")
          }
          EOF
          tail -30 "$GRADLE"

      - name: Build signed APK (Tauri)
        working-directory: src-tauri
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/keys/psygames-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Using keystore at: $ANDROID_KEYSTORE_PATH"
          ls -la "$ANDROID_KEYSTORE_PATH"
          # --aab вместе с --apk: отдельный ./gradlew bundleRelease НЕ работает —
          # gradle-таск rustBuild*Release требует живого tauri CLI (WebSocket IPC),
          # он есть только внутри cargo tauri android build (падение v1.120.3).
          cargo tauri android build --apk --aab

      # v1.190.0: после включения shrinkResources артефакт надо проверить руками —
      # веб-смоук APK не трогает, а ресурс, найденный по имени в рантайме, исчезает молча.
      # Проверяем, что на месте всё, без чего приложение не запустится.
      - name: APK после чистки ресурсов — цел
        working-directory: src-tauri
        run: |
          APK=$(find gen/android -name "*-release*.apk" | head -1)
          if [ -z "$APK" ]; then echo "ERROR: APK не найден"; exit 1; fi
          echo "APK: $APK  ($(du -m "$APK" | cut -f1) МБ)"
          python3 - "$APK" <<'PYEOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = z.namelist()
          need = {
            'манифест':      lambda: 'AndroidManifest.xml' in names,
            'таблица ресурсов': lambda: 'resources.arsc' in names,
            'байткод':       lambda: any(n.endswith('.dex') for n in names),
            'нативные .so':  lambda: any(n.endswith('.so') for n in names),
            'веб-сборка':    lambda: any(n.startswith('assets/') for n in names),
            'ресурсы res/':  lambda: any(n.startswith('res/') for n in names),
          }
          bad = [k for k, f in need.items() if not f()]
          man = z.read('AndroidManifest.xml').decode('utf-16-le', errors='ignore')
          for k in ('RECORD_AUDIO', 'MainActivity'):
              if k not in man: bad.append(f'манифест: нет {k}')
          dex = b''.join(z.read(n) for n in names if n.endswith('.dex'))
          if b'setOnApplyWindowInsetsListener' not in dex:
              bad.append('инсеты системных панелей вырезаны')
          print('файлов в APK:', len(names))
          # Иконку проверяем через aapt2, а не по имени файла: при чистке ресурсов AGP
          # переименовывает их в короткие, и поиск подстроки «mipmap» даёт ложную тревогу.
          import subprocess, glob, os
          aapt = sorted(glob.glob(os.path.join(os.environ.get('ANDROID_HOME',''), 'build-tools', '*', 'aapt2')))
          if aapt:
              out = subprocess.run([aapt[-1], 'dump', 'badging', sys.argv[1]], capture_output=True, text=True).stdout
              if 'application-icon' not in out: bad.append('иконка приложения не объявлена (aapt2)')
              else: print('иконка: объявлена, проверено aapt2')
          else:
              print('иконка: aapt2 не найден, проверку пропускаю')
          if bad:
              print('❌ ПОТЕРЯНО:', ', '.join(bad)); sys.exit(1)
          print('✅ всё на месте: манифест, ресурсы, байткод, .so, веб-сборка, иконка, инсеты')
          PYEOF

      - name: Locate APK + AAB
        working-directory: src-tauri
        run: |
          echo "--- APK ---"
          find gen/android -name "*release*.apk" -type f
          echo "--- AAB ---"
          find gen/android -name "*.aab" -type f
          mkdir -p out
          find gen/android -name "*release*.apk" -type f -exec cp {} out/PsyGames-android.apk \;
          find gen/android -name "*release*.aab" -type f -exec cp {} out/PsyGames-android.aab \;
          ls -la out/

      - name: ГЕЙТ — нативные .so выровнены на 16 КБ (Google Play, Android 15+)
        working-directory: src-tauri
        run: |
          # Проверяем ИМЕННО те .so, что уедут в стор (из готового APK).
          # LOAD-сегменты должны быть выровнены на 2**14 (0x4000 = 16 КБ), иначе
          # на устройствах с 16 КБ страницами приложение не запустится, а Google
          # Play блокирует прод. Ловим ЗДЕСЬ, а не постфактум в консоли разработчика.
          OBJDUMP=$(find "$ANDROID_HOME/ndk" -name llvm-objdump -path '*linux-x86_64*' | head -1)
          echo "objdump: $OBJDUMP"
          rm -rf so_gate && mkdir so_gate && cd so_gate
          unzip -q ../out/PsyGames-android.apk 'lib/*' -d x
          bad=0; n=0
          while IFS= read -r so; do
            n=$((n+1))
            # у llvm-objdump -p строки LOAD оканчиваются на "align 2**N"; нужно 2**14
            aligns=$("$OBJDUMP" -p "$so" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
            if echo "$aligns" | grep -qvw '2\*\*14'; then
              echo "✗ $so — LOAD align: $aligns (нужно 2**14)"; bad=1
            else
              echo "✓ $(basename $(dirname "$so"))/$(basename "$so") — 16 КБ (2**14)"
            fi
          done < <(find x/lib -name '*.so')
          echo "проверено .so: $n"
          [ "$n" -ge 4 ] || { echo "БЛОКЕР: ожидалось ≥4 .so, найдено $n"; exit 1; }
          [ "$bad" = 0 ] || { echo "БЛОКЕР: .so не выровнены на 16 КБ — Android 15+ упадёт"; exit 1; }

      # v1.162.0: полный предрелизный аудит APK одним скриптом. Появился после
      # того, как ДВАЖДЫ о проблеме сообщал Google, а не наша сборка: сначала
      # 16 КБ выравнивание, потом отображение от края до края. Всё, что Play
      # умеет находить постфактум, должно падать здесь.
      - name: ГЕЙТ — предрелизный аудит APK (блокеры Google Play)
        working-directory: src-tauri
        run: |
          python3 -m pip install --quiet pyaxmlparser
          OBJDUMP=$(find "$ANDROID_HOME/ndk" -name llvm-objdump -path '*linux-x86_64*' | head -1)
          export PATH="$(dirname "$OBJDUMP"):$PATH"
          python3 ../scripts/android_release_audit.py out/PsyGames-android.apk

      # Tauri подписывает APK, но AAB из --aab выходит БЕЗ jar-подписи
      # (проверено на артефакте: нет корневого META-INF/*.RSA) — Play такой
      # не примет. Подписываем upload-ключом явно + verify как гейт.
      - name: Sign AAB (jarsigner) + verify
        working-directory: src-tauri
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/keys/psygames-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jarsigner -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            out/PsyGames-android.aab "$ANDROID_KEY_ALIAS"
          # БЕЗ -strict: android upload-ключ всегда self-signed, -strict на этом
          # валится (exit 4, «with signer errors») — ложная тревога (падение v1.120.4).
          # Гейт: подпись существует и верифицируется.
          verify_out=$(jarsigner -verify out/PsyGames-android.aab)
          echo "$verify_out"
          echo "$verify_out" | grep -q "jar verified" || { echo "✗ AAB is NOT signed"; exit 1; }
          echo "✓ AAB signed & verified (self-signed upload key — норма для Play)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-android-apk
          path: src-tauri/out/PsyGames-android.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: PsyGames-android-aab
          path: src-tauri/out/PsyGames-android.aab
          retention-days: 30

  # ─── Web deploy → psygames-web GH Pages repo ──────────────────────────
  # Builds the web bundle WITH baseUrl="/psygames-web" and pushes the
  # contents of dist/ into donosov999-ai/psygames-web (main branch).
  # GH Pages picks it up automatically. Same source = same content across
  # web + native builds.
  web-deploy:
    name: Web → psygames-web GH Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 23.08.2026: было `needs: [typecheck]` — и это единственное, что стояло
    # между правкой в main и живым вебом. Теперь выкладку держат ещё и smoke
    # (заход В КАЖДУЮ игру) и веб-гейты (первый кадр + размер кнопок на поле).
    needs: [typecheck, smoke, web-gates]
    if: github.ref == 'refs/heads/main'  # only main branch deploys
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build web (with /psygames-web baseUrl) — WEB-DEMO
        working-directory: frontend
        env:
          # Решение Дениса (07.2026): публичный web = ТОЛЬКО ДЕМО (лендинг + демо-раунды,
          # прогресс не пишется, CTA «Скачать приложение»). Флаг инлайнится babel'ем при
          # экспорте (src/services/buildTarget.ts). Tauri-джобы экспортят БЕЗ флага
          # (свой export в каждой джобе) = полное приложение.
          EXPO_PUBLIC_BUILD_TARGET: web-demo
        run: |
          # app.json already has baseUrl=/psygames-web in committed state
          grep baseUrl app.json
          npx expo export -p web
          ls -la dist/

      - name: Checkout psygames-web target repo
        uses: actions/checkout@v6
        with:
          repository: donosov999-ai/psygames-web
          token: ${{ secrets.PSYGAMES_WEB_DEPLOY_TOKEN }}
          path: psygames-web-target

      - name: Sync dist → psygames-web (preserve .git, .nojekyll, README, download.html, profiles.html)
        run: |
          cd psygames-web-target
          # Preserve git metadata + GH-Pages flag + README + landing pages
          find . -maxdepth 1 ! -name '.git' ! -name '.nojekyll' ! -name 'README.md' ! -name 'download.html' ! -name 'profiles.html' ! -name '.' -exec rm -rf {} +
          cp -R ../frontend/dist/* .
          # Re-add .nojekyll in case it was missing
          touch .nojekyll
          echo "--- new state ---"
          ls -la | head -20

      - name: Commit + push to psygames-web
        working-directory: psygames-web-target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — psygames-web already up to date"
            exit 0
          fi
          git commit -m "Auto-deploy from psygames-native@${{ github.sha }} (run ${{ github.run_id }}, event ${{ github.event_name }})"
          git push

  # ─── Create GitHub Release if tagged (vX.Y.Z) ─────────────────────────
  release:
    # v1.205.0: + web-gates — релиз не выходит, если вёрстка схлопнулась на первом
    # кадре или на поле появились кнопки, в которые не попасть пальцем.
    needs: [macos-arm, windows-x64, android, typecheck, smoke, web-gates, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Show artifacts
        run: find artifacts -type f

      # v1.17.0: собрать latest.json для Tauri-updater (desktop: mac arm64 + win x64).
      # .sig — содержимое подписи Tauri-updater (single-line base64). URL'ы ведут
      # на ассеты ЭТОГО релиза; endpoint в приложении — releases/latest/download/latest.json.
      - name: Generate latest.json (Tauri updater manifest)
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          BASE="https://github.com/donosov999-ai/psygames-native/releases/download/${TAG}"
          MAC_SIG_FILE="artifacts/PsyGames-macos-updater/PsyGames.app.tar.gz.sig"
          # версионные имена — НЕ head -1: кэш CI может оставить .exe прошлой версии
          WIN_EXE="PsyGames_${VER}_x64-setup.exe"
          WIN_EXE_PATH="artifacts/PsyGames-windows-x64-exe/${WIN_EXE}"
          WIN_SIG_FILE="artifacts/PsyGames-windows-updater-sig/${WIN_EXE}.sig"
          PLATFORMS=""
          if [ -f "$MAC_SIG_FILE" ]; then
            MAC_SIG=$(tr -d '\n\r' < "$MAC_SIG_FILE")
            PLATFORMS="\"darwin-aarch64\":{\"signature\":\"${MAC_SIG}\",\"url\":\"${BASE}/PsyGames.app.tar.gz\"}"
          else
            echo "WARN: mac updater .sig not found — darwin omitted from latest.json"
          fi
          if [ -f "$WIN_SIG_FILE" ] && [ -f "$WIN_EXE_PATH" ]; then
            WIN_SIG=$(tr -d '\n\r' < "$WIN_SIG_FILE")
            [ -n "$PLATFORMS" ] && PLATFORMS="${PLATFORMS},"
            PLATFORMS="${PLATFORMS}\"windows-x86_64\":{\"signature\":\"${WIN_SIG}\",\"url\":\"${BASE}/${WIN_EXE}\"}"
          else
            echo "WARN: win updater .sig/.exe not found — windows omitted from latest.json"
          fi
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{\n  "version": "%s",\n  "pub_date": "%s",\n  "platforms": {%s}\n}\n' "$VER" "$PUB_DATE" "$PLATFORMS" > latest.json
          echo "--- latest.json ---"
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/PsyGames-macos-arm64/PsyGames-macos-arm64.tar.gz
            artifacts/PsyGames-macos-updater/PsyGames.app.tar.gz
            artifacts/PsyGames-windows-x64-exe/*.exe
            artifacts/PsyGames-windows-x64-msi/*.msi
            artifacts/PsyGames-android-apk/PsyGames-android.apk
            artifacts/PsyGames-android-aab/PsyGames-android.aab
            latest.json
          generate_release_notes: true

      # Sync release binaries → Contabo psy-games.pro/downloads/ под СТАБИЛЬНЫМИ
      # именами (кнопки на download/ постоянны). continue-on-error: GitHub Release —
      # источник истины; если Contabo SFTP флапнул — фолбэк ./deploy-downloads.sh.
      - name: Sync binaries to Contabo /downloads
        continue-on-error: true
        env:
          CONTABO_SSH_HOST: ${{ secrets.CONTABO_SSH_HOST }}
          CONTABO_SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
          CONTABO_SSH_PASS: ${{ secrets.CONTABO_SSH_PASS }}
          CONTABO_REMOTE_DIR: ${{ secrets.CONTABO_REMOTE_DIR }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p dl
          cp artifacts/PsyGames-macos-arm64/PsyGames-macos-arm64.tar.gz dl/
          cp artifacts/PsyGames-android-apk/PsyGames-android.apk dl/
          cp artifacts/PsyGames-windows-x64-exe/*-setup.exe dl/PsyGames-windows-x64-setup.exe
          cp artifacts/PsyGames-windows-x64-msi/*.msi dl/PsyGames-windows-x64.msi || true
          echo "--- uploading to /downloads ---"; ls -lh dl/
          lftp -u "$CONTABO_SSH_USER","$CONTABO_SSH_PASS" "sftp://$CONTABO_SSH_HOST" -e "
            set sftp:auto-confirm yes; set net:timeout 60; set net:max-retries 3; set net:connection-limit 1;
            mkdir -f $CONTABO_REMOTE_DIR/downloads;
            mirror -R --no-perms dl/ $CONTABO_REMOTE_DIR/downloads/;
            bye"
          echo "✓ synced → https://psy-games.pro/downloads/"

      # Поднять номер версии в version.json — бейдж на /download читает его через
      # fetch (Astro-источник: версия не вшита в HTML). Один файл вместо 7 страниц.
      - name: Bump version.json on Contabo
        continue-on-error: true
        env:
          CONTABO_SSH_HOST: ${{ secrets.CONTABO_SSH_HOST }}
          CONTABO_SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
          CONTABO_SSH_PASS: ${{ secrets.CONTABO_SSH_PASS }}
          CONTABO_REMOTE_DIR: ${{ secrets.CONTABO_REMOTE_DIR }}
        run: |
          set -e
          command -v lftp >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq lftp; }
          VER="${GITHUB_REF_NAME#v}"
          echo "Target version: $VER"
          printf '{ "version": "%s" }\n' "$VER" > version.json
          cat version.json
          lftp -u "$CONTABO_SSH_USER","$CONTABO_SSH_PASS" "sftp://$CONTABO_SSH_HOST" -e "
            set sftp:auto-confirm yes; set net:timeout 60; set net:max-retries 3; set net:connection-limit 1;
            put version.json -o $CONTABO_REMOTE_DIR/version.json;
            bye"
          echo "OK version.json -> $VER (бейдж на /download подхватит через fetch)"
          # 🔴 ПРОЧИТАТЬ ОБРАТНО, А НЕ ПОВЕРИТЬ. Шаг стоит под continue-on-error, и
          # ровно поэтому его провал был НЕВИДИМ: 26.08.2026 файл три выпуска подряд
          # отдавал 1.236.0, пока приложение считало эту версию свежей. «Команда не
          # упала» и «файл на месте» — разные утверждения; проверяем второе.
          sleep 3
          LIVE=$(curl -fsS --max-time 20 "https://psy-games.pro/version.json" || echo "")
          echo "прод отдаёт: $LIVE"
          case "$LIVE" in
            *"\"$VER\""*) echo "✅ version.json на проде совпал с тегом" ;;
            *) echo "::error title=version.json не обновился::прод отдаёт «$LIVE», ждали $VER — приложение НЕ УЗНАЕТ о выпуске"; exit 1 ;;
          esac

  # ─── Web → Contabo psy-games.pro/play (на тегах) ──────────────────────
  # Билдит web с baseUrl=/play и заливает на Contabo /play по SFTP.
  # Закрывает дырку: /downloads авто (release job), а /play раньше был руками.
  play-deploy:
    name: Web → Contabo /play
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build web (baseUrl=/play) — WEB-DEMO
        working-directory: frontend
        env:
          # /play/ на psy-games.pro = ТОЛЬКО ДЕМО (решение Дениса 07.2026) — тот же
          # флаг, что и psygames-web деплой выше. Tauri-джобы без флага (полная версия).
          EXPO_PUBLIC_BUILD_TARGET: web-demo
        run: |
          sed -i 's|"baseUrl": "/psygames-web"|"baseUrl": "/play"|' app.json
          npx expo export -p web
          node scripts/create-web-route-aliases.mjs
          ls -la dist/ | head
      - name: version.json — источник правды для проверки обновлений в приложении
        run: |
          # Приложение (appUpdates.ts) спрашивает https://psy-games.pro/play/version.json;
          # GitHub Releases не годится — репо приватный.
          printf '{"version": "%s"}\n' "${GITHUB_REF_NAME#v}" > frontend/dist/version.json
          cat frontend/dist/version.json
          # ⚠️ Здесь только КЛАДЁМ файл в сборку; проверка чтением — после заливки,
          # отдельным шагом ниже. Разделено намеренно: провалиться может как сборка,
          # так и заливка, и путать их значит чинить не то.

      - name: SFTP dist → Contabo /play
        env:
          CONTABO_SSH_HOST: ${{ secrets.CONTABO_SSH_HOST }}
          CONTABO_SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
          CONTABO_SSH_PASS: ${{ secrets.CONTABO_SSH_PASS }}
          CONTABO_REMOTE_DIR: ${{ secrets.CONTABO_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$CONTABO_SSH_USER","$CONTABO_SSH_PASS" "sftp://$CONTABO_SSH_HOST" -e "
            set sftp:auto-confirm yes; set net:timeout 60; set net:max-retries 3; set net:connection-limit 1;
            mkdir -f $CONTABO_REMOTE_DIR/play;
            mirror -R --delete --no-perms frontend/dist/ $CONTABO_REMOTE_DIR/play/;
            bye"
          echo "✓ /play synced → https://psy-games.pro/play/"

  # Автодеплой в Google Play — job В ТОМ ЖЕ run, что и билд.
  # Прежний путь через workflow_run в deploy-android.yml на тег-пушах не
  # срабатывал вовсе (v1.146: событие не доставлено, run даже не создан) —
  # кросс-workflow триггер хрупок; same-run job этого класса проблем не имеет.
  # deploy-android.yml оставлен только как ручной инструмент (workflow_dispatch).
  google-play:
    # ⚠️ ИМЯ ДЖОБЫ ВРАЛО ДВЕНАДЦАТЬ ДНЕЙ. Оно осталось от первой редакции скрипта,
    # где TRACKS = ['internal', 'alpha', 'closed-test1']. 07.08.2026 коммитом
    # e43358e («deploy new releases straight to production») дорожка сменилась на
    # одну — production, и релиз с тех пор уходит СРАЗУ ВСЕМ, `status: completed`,
    # раскатка 100%. Имя при этом продолжало обещать закрытый тест: сборка,
    # названная «закрытым тестом», публикует в магазин на всех.
    name: Android → Google Play (production, 100%)
    runs-on: ubuntu-latest
    needs: [android, typecheck, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download AAB (same run)
        uses: actions/download-artifact@v4
        with:
          name: PsyGames-android-aab
          path: ./aab

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install googleapis

      - name: Upload to Google Play
        env:
          GOOGLE_PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SA_JSON }}
          AAB_PATH: ./aab/PsyGames-android.aab
          VERSION_NAME: ${{ github.ref_name }}
        run: node .github/scripts/deploy_play.js

  # ─── Доставка: дошло ли до людей ──────────────────────────────────────
  # 🔴 ЗАЧЕМ ОТДЕЛЬНАЯ ДЖОБА, ЕСЛИ ВСЁ ВИДНО В СПИСКЕ.
  #
  # Разбор 27.08.2026: из восьми последних тегов до Google Play доехали ТРИ.
  # И ни один провал не был замечен — потому что смотреть надо было в список
  # джоб, а туда никто не смотрит. Два способа спрятаться:
  #   · `continue-on-error: true` у play-deploy — джоба красная, ПРОГОН зелёный;
  #   · пропуск: упал typecheck → release и заливка в Play `skipped`, а
  #     пропущенная джоба в списке выглядит безобиднее красной. Результат тот же:
  #     выпуска нет.
  #
  # Эта джоба сводит все три пути доставки тега в ОДИН ответ «дошло / не дошло» и
  # роняет прогон, если хоть один не доехал. Тег без выпуска перестаёт выглядеть
  # успешным.
  #
  # ⚠️ `if: always()` обязателен: без него джоба сама пропускается ровно тогда,
  # когда нужна больше всего — когда упало то, от чего она зависит.
  delivery-check:
    name: 🚚 Доставка — дошло ли до людей
    runs-on: ubuntu-latest
    # ⚠️ web-deploy СЮДА НЕ ВХОДИТ, и это проверено, а не предположено: у него
    # стоит `if: github.ref == 'refs/heads/main'`, то есть на теге он не бежит
    # никогда и его результат ВСЕГДА `skipped`. Включи его — и эта джоба краснела
    # бы на КАЖДОМ выпуске, то есть стала бы шумом на второй же день.
    needs: [release, google-play, play-deploy]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Свести три пути доставки в один ответ
        env:
          R_RELEASE: ${{ needs.release.result }}
          R_PLAY: ${{ needs.google-play.result }}
          R_DEMO: ${{ needs.play-deploy.result }}
        run: |
          echo "тег: $GITHUB_REF_NAME"
          echo "  GitHub Release     : $R_RELEASE"
          echo "  Google Play        : $R_PLAY"
          echo "  веб-демо /play     : $R_DEMO"
          echo ""
          MISSED=""
          # ⚠️ Проверяем НЕ на 'failure', а на «не success»: пропуск это тоже
          # недоставка, и именно он трижды прошёл незамеченным.
          [ "$R_RELEASE" = "success" ] || MISSED="$MISSED GitHub-Release($R_RELEASE)"
          [ "$R_PLAY"    = "success" ] || MISSED="$MISSED Google-Play($R_PLAY)"
          [ "$R_DEMO"    = "success" ] || MISSED="$MISSED веб-демо($R_DEMO)"
          if [ -n "$MISSED" ]; then
            echo "::error title=ВЫПУСК НЕ ДОШЁЛ ДО ЛЮДЕЙ::$GITHUB_REF_NAME —$MISSED"
            echo "🔴 НЕ ДОСТАВЛЕНО:$MISSED"
            echo ""
            echo "   ⚠️ Тег перезапускать НЕЛЬЗЯ: Play принимает каждый versionCode один раз."
            echo "   Чинить причину и поднимать patch-версию — см. PROJECT_REF.md §5."
            exit 1
          fi
          echo "✅ выпуск $GITHUB_REF_NAME дошёл всеми тремя путями"
